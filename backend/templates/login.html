{% extends 'base.html' %}{% block title %}登录{% endblock %}
{% block content %}<section class="account-panel" data-login>
<h1>登录</h1><p>使用注册邮箱和密码登录，继续阅读通鉴与专题。</p>
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
{{ form.as_p }}<button type="submit">登录</button></form>
<p><a href="{% url 'password_reset' %}">忘记密码？</a></p>
<p>还没有账号？<a href="{% url 'register' %}?next={{ next|urlencode }}">注册账号</a></p>
<p class="small">原验证码账号可通过“忘记密码”设置密码，已有购买记录会保留。</p>
</section>{% endblock %}
