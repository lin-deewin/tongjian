{% extends 'base.html' %}{% block title %}修改密码{% endblock %}
{% block content %}<section class="account-panel"><h1>修改密码</h1>
<p>输入当前密码，再设置新密码。忘记当前密码时，可<a href="{% url 'password_reset' %}">通过邮箱找回</a>。</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">保存新密码</button></form>
<p class="small">新密码至少 6 个字符，可以使用纯数字。修改成功后，其他设备需要重新登录。</p>
<p><a href="{% url 'account' %}">返回我的账号</a></p></section>{% endblock %}
