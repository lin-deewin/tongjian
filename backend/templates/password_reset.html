{% extends 'base.html' %}{% block title %}忘记密码{% endblock %}
{% block content %}<section class="account-panel"><h1>找回密码</h1>
<p>填写注册邮箱，我们会发送重设密码的链接。原验证码账号也可以在这里设置密码。</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">发送重设链接</button></form>
<p><a href="{% url 'login' %}">返回登录</a></p></section>{% endblock %}
