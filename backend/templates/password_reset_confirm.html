{% extends 'base.html' %}{% block title %}重设密码{% endblock %}
{% block content %}<section class="account-panel"><h1>重设密码</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">保存新密码</button></form>
{% else %}<p>链接已失效或已使用，请重新申请。</p><p><a href="{% url 'password_reset' %}">重新找回密码</a></p>{% endif %}</section>{% endblock %}
