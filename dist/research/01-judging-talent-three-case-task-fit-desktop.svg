<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 342" width="880" height="342"><title id="title">三案中的能力与证据：同一个“能”不能覆盖全部岗位</title><desc id="desc">本表是基于史料的定性比较，不是人物评分。每一行把线索、具体任务和能够推出的结论分开；“能力”必须连同任务说，不能把一个岗位的证据外推到所有岗位。[[s2]] [[s7]] [[s9]] [[s10]] [[s11]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">已有线索</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">被检验的任务</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">证据边界</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="91"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">赵括</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="91"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">名将之子、熟读兵书、善谈</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">兵；也有父亲与母亲的警告</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="91"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">长平前军统率：部署、补给</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">、应变与承受秦军诱导</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="91"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">败局说明此次统军失配；不</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">能抹去所有谈论能力，也不</text><text data-field="cell" x="636" y="141" font-size="16px" fill="#26342e">能独担赵国败因</text><rect class="box" data-field="cell" x="30" y="161" width="150" height="68"/><text data-field="cell" x="40" y="186" font-size="16px" fill="#26342e">马谡</text><rect class="box" data-field="cell" x="180" y="161" width="223" height="68"/><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">善论军计；南中“攻心”建</text><text data-field="cell" x="190" y="209" font-size="16px" fill="#26342e">议被采纳并见效</text><rect class="box" data-field="cell" x="403" y="161" width="223" height="68"/><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">街亭独立指挥：遵节度、据</text><text data-field="cell" x="413" y="209" font-size="16px" fill="#26342e">水、组织队伍、听取规谏</text><rect class="box" data-field="cell" x="626" y="161" width="223" height="68"/><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">建议能力有正面证据；街亭</text><text data-field="cell" x="636" y="209" font-size="16px" fill="#26342e">显示统军执行和纠错不足</text><rect class="box" data-field="cell" x="30" y="229" width="150" height="91"/><text data-field="cell" x="40" y="254" font-size="16px" fill="#26342e">王猛</text><rect class="box" data-field="cell" x="180" y="229" width="223" height="91"/><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">初期声望未必等于已验证；</text><text data-field="cell" x="190" y="277" font-size="16px" fill="#26342e">受苻坚委任后逐步留下记录</text><rect class="box" data-field="cell" x="403" y="229" width="223" height="91"/><text data-field="cell" x="413" y="254" font-size="16px" fill="#26342e">游说、军政安排、选任、行</text><text data-field="cell" x="413" y="277" font-size="16px" fill="#26342e">政纠偏和战略劝告等多种任</text><text data-field="cell" x="413" y="300" font-size="16px" fill="#26342e">务</text><rect class="box" data-field="cell" x="626" y="229" width="223" height="91"/><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">多场考验扩大可信范围；不</text><text data-field="cell" x="636" y="277" font-size="16px" fill="#26342e">能据前期成功保证每个后续</text><text data-field="cell" x="636" y="300" font-size="16px" fill="#26342e">判断正确</text></svg>