<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1136" width="320" height="1136"><title id="title">三案中的能力与证据：同一个“能”不能覆盖全部岗位</title><desc id="desc">本表是基于史料的定性比较，不是人物评分。每一行把线索、具体任务和能够推出的结论分开；“能力”必须连同任务说，不能把一个岗位的证据外推到所有岗位。[[s2]] [[s7]] [[s9]] [[s10]] [[s11]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="372"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">赵括</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">已有线索</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">名将之子、熟读兵书、善谈兵；</text><text data-field="value" x="26" y="144" font-size="17px" fill="#26342e">也有父亲与母亲的警告</text><text data-field="dimension" x="26" y="180" font-size="17px" fill="#285342">被检验的任务</text><text data-field="value" x="26" y="212" font-size="17px" fill="#26342e">长平前军统率：部署、补给、应</text><text data-field="value" x="26" y="240" font-size="17px" fill="#26342e">变与承受秦军诱导</text><text data-field="dimension" x="26" y="276" font-size="17px" fill="#285342">证据边界</text><text data-field="value" x="26" y="308" font-size="17px" fill="#26342e">败局说明此次统军失配；不能抹</text><text data-field="value" x="26" y="336" font-size="17px" fill="#26342e">去所有谈论能力，也不能独担赵</text><text data-field="value" x="26" y="364" font-size="17px" fill="#26342e">国败因</text><rect class="box" data-field="case-card" x="16" y="408" rx="8" width="288" height="344"/><text data-field="case" x="26" y="434" font-size="17px" fill="#285342">马谡</text><text data-field="dimension" x="26" y="470" font-size="17px" fill="#285342">已有线索</text><text data-field="value" x="26" y="502" font-size="17px" fill="#26342e">善论军计；南中“攻心”建议被</text><text data-field="value" x="26" y="530" font-size="17px" fill="#26342e">采纳并见效</text><text data-field="dimension" x="26" y="566" font-size="17px" fill="#285342">被检验的任务</text><text data-field="value" x="26" y="598" font-size="17px" fill="#26342e">街亭独立指挥：遵节度、据水、</text><text data-field="value" x="26" y="626" font-size="17px" fill="#26342e">组织队伍、听取规谏</text><text data-field="dimension" x="26" y="662" font-size="17px" fill="#285342">证据边界</text><text data-field="value" x="26" y="694" font-size="17px" fill="#26342e">建议能力有正面证据；街亭显示</text><text data-field="value" x="26" y="722" font-size="17px" fill="#26342e">统军执行和纠错不足</text><rect class="box" data-field="case-card" x="16" y="766" rx="8" width="288" height="344"/><text data-field="case" x="26" y="792" font-size="17px" fill="#285342">王猛</text><text data-field="dimension" x="26" y="828" font-size="17px" fill="#285342">已有线索</text><text data-field="value" x="26" y="860" font-size="17px" fill="#26342e">初期声望未必等于已验证；受苻</text><text data-field="value" x="26" y="888" font-size="17px" fill="#26342e">坚委任后逐步留下记录</text><text data-field="dimension" x="26" y="924" font-size="17px" fill="#285342">被检验的任务</text><text data-field="value" x="26" y="956" font-size="17px" fill="#26342e">游说、军政安排、选任、行政纠</text><text data-field="value" x="26" y="984" font-size="17px" fill="#26342e">偏和战略劝告等多种任务</text><text data-field="dimension" x="26" y="1020" font-size="17px" fill="#285342">证据边界</text><text data-field="value" x="26" y="1052" font-size="17px" fill="#26342e">多场考验扩大可信范围；不能据</text><text data-field="value" x="26" y="1080" font-size="17px" fill="#26342e">前期成功保证每个后续判断正确</text></svg>