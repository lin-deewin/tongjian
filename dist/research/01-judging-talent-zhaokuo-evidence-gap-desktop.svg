<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 212" width="880" height="212"><title id="title">赵括任命中的证据缺口（分析示意）</title><desc id="desc">箭头表示判断从线索走向任务检验的顺序，不表示赵括败亡只有一个原因。前三步和长平行动见《通鉴》卷五前260年；图示的“证据缺口”只说明本文所引记载没有提供同等统军任务的先前实绩，不断言赵王当时从未考察过赵括。[[s1]] [[s2]] [[s3]] [[s4]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="191" height="164"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">名与谈论</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">名将之子，少学兵法，</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">自以为能胜天下</text><text data-field="link-note" x="40" y="162" font-size="13px" fill="#647069">名声与谈论提供线索，不</text><text data-field="link-note" x="40" y="180" font-size="13px" fill="#647069">等于岗位能力</text><rect class="box" data-field="card" x="239" y="24" rx="8" width="191" height="164"/><text data-field="label" x="249" y="51" font-size="17px" fill="#285342">已有警告</text><text data-field="detail" x="249" y="82" font-size="16px" fill="#26342e">蔺相如、赵奢和赵母分</text><text data-field="detail" x="249" y="105" font-size="16px" fill="#26342e">别指出不同风险</text><text data-field="link-note" x="249" y="162" font-size="13px" fill="#647069">警告指出缺口，但没有改</text><text data-field="link-note" x="249" y="180" font-size="13px" fill="#647069">变任命</text><rect class="box" data-field="card" x="448" y="24" rx="8" width="191" height="164"/><text data-field="label" x="458" y="51" font-size="17px" fill="#285342">直接任命</text><text data-field="detail" x="458" y="82" font-size="16px" fill="#26342e">所引记载缺少同等岗位</text><text data-field="detail" x="458" y="105" font-size="16px" fill="#26342e">实绩</text><text data-field="link-note" x="458" y="162" font-size="13px" fill="#647069">实际任务才暴露指挥、应</text><text data-field="link-note" x="458" y="180" font-size="13px" fill="#647069">变与后勤的联合要求</text><rect class="box" data-field="card" x="657" y="24" rx="8" width="191" height="164"/><text data-field="label" x="667" y="51" font-size="17px" fill="#285342">战场考验</text><text data-field="detail" x="667" y="82" font-size="16px" fill="#26342e">更换军吏、出击后粮道</text><text data-field="detail" x="667" y="105" font-size="16px" fill="#26342e">被断，撤守与救援均受</text><text data-field="detail" x="667" y="128" font-size="16px" fill="#26342e">限</text><path class="line" d="M224 106H229"/><path d="m227 101 9 5-9 5z" fill="#285342"/><path class="line" d="M433 106H438"/><path d="m436 101 9 5-9 5z" fill="#285342"/><path class="line" d="M642 106H647"/><path d="m645 101 9 5-9 5z" fill="#285342"/></svg>