<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 838" width="320" height="838"><title id="title">赵括任命中的证据缺口（分析示意）</title><desc id="desc">箭头表示判断从线索走向任务检验的顺序，不表示赵括败亡只有一个原因。前三步和长平行动见《通鉴》卷五前260年；图示的“证据缺口”只说明本文所引记载没有提供同等统军任务的先前实绩，不断言赵王当时从未考察过赵括。[[s1]] [[s2]] [[s3]] [[s4]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="199"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">名与谈论</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">名将之子，少学兵法，自以为能胜天</text><text data-field="detail" x="26" y="115" font-size="17px" fill="#26342e">下</text><text data-field="link-note" x="26" y="181" font-size="17px" fill="#647069">名声与谈论提供线索，不等于岗</text><text data-field="link-note" x="26" y="209" font-size="17px" fill="#647069">位能力</text><rect class="box" data-field="card" x="16" y="257" rx="8" width="288" height="171"/><text data-field="label" x="26" y="284" font-size="17px" fill="#285342">已有警告</text><text data-field="detail" x="26" y="320" font-size="17px" fill="#26342e">蔺相如、赵奢和赵母分别指出不同风</text><text data-field="detail" x="26" y="348" font-size="17px" fill="#26342e">险</text><text data-field="link-note" x="26" y="414" font-size="17px" fill="#647069">警告指出缺口，但没有改变任命</text><rect class="box" data-field="card" x="16" y="462" rx="8" width="288" height="171"/><text data-field="label" x="26" y="489" font-size="17px" fill="#285342">直接任命</text><text data-field="detail" x="26" y="525" font-size="17px" fill="#26342e">所引记载缺少同等岗位实绩</text><text data-field="link-note" x="26" y="591" font-size="17px" fill="#647069">实际任务才暴露指挥、应变与后</text><text data-field="link-note" x="26" y="619" font-size="17px" fill="#647069">勤的联合要求</text><rect class="box" data-field="card" x="16" y="667" rx="8" width="288" height="133"/><text data-field="label" x="26" y="694" font-size="17px" fill="#285342">战场考验</text><text data-field="detail" x="26" y="730" font-size="17px" fill="#26342e">更换军吏、出击后粮道被断，撤守与</text><text data-field="detail" x="26" y="758" font-size="17px" fill="#26342e">救援均受限</text><path class="line" d="M160 223V248"/><path d="m155 246 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 428V453"/><path d="m155 451 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 633V658"/><path d="m155 656 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>