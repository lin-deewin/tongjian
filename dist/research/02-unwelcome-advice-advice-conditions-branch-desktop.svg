<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 358" width="880" height="358"><title id="title">同一条逆耳意见，在哪些条件下可能被听见？</title><desc id="desc">这是作者根据三案重建的判断树，不是三位当事人共同列出的制度清单。条件越接近决策者的当前利益、越能落成可执行步骤，越可能进入修正；但即使满足这些条件，也不能保证采纳。[[s7]] [[s8]] [[s10]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><text data-field="prompt" x="30" y="24" font-size="17px" fill="#285342">不同意见已经指出风险，决策者接下来会怎样处理？</text><rect class="box" data-field="branch" x="30" y="65" rx="8" width="264" height="279"/><text data-field="option" x="40" y="92" font-size="17px" fill="#285342">进入修正</text><text data-field="field-label" x="40" y="121" font-size="14px" fill="#285342">成立条件：</text><text data-field="field-value" x="40" y="144" font-size="16px" fill="#26342e">决策尚未锁死，方案保留目标且能</text><text data-field="field-value" x="40" y="167" font-size="16px" fill="#26342e">核对事实</text><text data-field="field-label" x="40" y="195" font-size="14px" fill="#285342">代价：</text><text data-field="field-value" x="40" y="218" font-size="16px" fill="#26342e">承认原判断或承诺有偏差</text><text data-field="field-label" x="40" y="246" font-size="14px" fill="#285342">限度：</text><text data-field="field-value" x="40" y="269" font-size="16px" fill="#26342e">只能改变这一项决定，不能保证长</text><text data-field="field-value" x="40" y="292" font-size="16px" fill="#26342e">期信任</text><rect class="box" data-field="branch" x="308" y="65" rx="8" width="264" height="279"/><text data-field="option" x="318" y="92" font-size="17px" fill="#285342">暂时搁置</text><text data-field="field-label" x="318" y="121" font-size="14px" fill="#285342">成立条件：</text><text data-field="field-value" x="318" y="144" font-size="16px" fill="#26342e">意见能阻止局部行动，但触及既定</text><text data-field="field-value" x="318" y="167" font-size="16px" fill="#26342e">威仪或资源投入</text><text data-field="field-label" x="318" y="195" font-size="14px" fill="#285342">代价：</text><text data-field="field-value" x="318" y="218" font-size="16px" fill="#26342e">保留问题，等待代价显现</text><text data-field="field-label" x="318" y="246" font-size="14px" fill="#285342">限度：</text><text data-field="field-value" x="318" y="269" font-size="16px" fill="#26342e">停下一个惩罚，不等于改变权力结</text><text data-field="field-value" x="318" y="292" font-size="16px" fill="#26342e">构</text><rect class="box" data-field="branch" x="586" y="65" rx="8" width="264" height="279"/><text data-field="option" x="596" y="92" font-size="17px" fill="#285342">转为个人冲突</text><text data-field="field-label" x="596" y="121" font-size="14px" fill="#285342">成立条件：</text><text data-field="field-value" x="596" y="144" font-size="16px" fill="#26342e">信息渠道收缩，反对者与竞争者关</text><text data-field="field-value" x="596" y="167" font-size="16px" fill="#26342e">系恶化</text><text data-field="field-label" x="596" y="195" font-size="14px" fill="#285342">代价：</text><text data-field="field-value" x="596" y="218" font-size="16px" fill="#26342e">把政策争论解释成不服从或结党</text><text data-field="field-label" x="596" y="246" font-size="14px" fill="#285342">限度：</text><text data-field="field-value" x="596" y="269" font-size="16px" fill="#26342e">方案越具体，越可能被当成挑战权</text><text data-field="field-value" x="596" y="292" font-size="16px" fill="#26342e">威</text></svg>