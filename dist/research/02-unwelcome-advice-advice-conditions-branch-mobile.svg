<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1076" width="320" height="1076"><title id="title">同一条逆耳意见，在哪些条件下可能被听见？</title><desc id="desc">这是作者根据三案重建的判断树，不是三位当事人共同列出的制度清单。条件越接近决策者的当前利益、越能落成可执行步骤，越可能进入修正；但即使满足这些条件，也不能保证采纳。[[s7]] [[s8]] [[s10]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><text data-field="prompt" x="16" y="24" font-size="17px" fill="#285342">不同意见已经指出风险，决策者接下</text><text data-field="prompt" x="16" y="52" font-size="17px" fill="#285342">来会怎样处理？</text><rect class="box" data-field="branch" x="16" y="98" rx="8" width="288" height="324"/><text data-field="option" x="26" y="125" font-size="17px" fill="#285342">进入修正</text><text data-field="field-label" x="26" y="159" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="187" font-size="17px" fill="#26342e">决策尚未锁死，方案保留目标且能核</text><text data-field="field-value" x="26" y="215" font-size="17px" fill="#26342e">对事实</text><text data-field="field-label" x="26" y="248" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="276" font-size="17px" fill="#26342e">承认原判断或承诺有偏差</text><text data-field="field-label" x="26" y="309" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="337" font-size="17px" fill="#26342e">只能改变这一项决定，不能保证长期</text><text data-field="field-value" x="26" y="365" font-size="17px" fill="#26342e">信任</text><rect class="box" data-field="branch" x="16" y="438" rx="8" width="288" height="296"/><text data-field="option" x="26" y="465" font-size="17px" fill="#285342">暂时搁置</text><text data-field="field-label" x="26" y="499" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="527" font-size="17px" fill="#26342e">意见能阻止局部行动，但触及既定威</text><text data-field="field-value" x="26" y="555" font-size="17px" fill="#26342e">仪或资源投入</text><text data-field="field-label" x="26" y="588" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="616" font-size="17px" fill="#26342e">保留问题，等待代价显现</text><text data-field="field-label" x="26" y="649" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="677" font-size="17px" fill="#26342e">停下一个惩罚，不等于改变权力结构</text><rect class="box" data-field="branch" x="16" y="750" rx="8" width="288" height="296"/><text data-field="option" x="26" y="777" font-size="17px" fill="#285342">转为个人冲突</text><text data-field="field-label" x="26" y="811" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="839" font-size="17px" fill="#26342e">信息渠道收缩，反对者与竞争者关系</text><text data-field="field-value" x="26" y="867" font-size="17px" fill="#26342e">恶化</text><text data-field="field-label" x="26" y="900" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="928" font-size="17px" fill="#26342e">把政策争论解释成不服从或结党</text><text data-field="field-label" x="26" y="961" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="989" font-size="17px" fill="#26342e">方案越具体，越可能被当成挑战权威</text></svg>