<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 212" width="880" height="212"><title id="title">汲黯劝阻“迎降”安排：意见进入决定的四个关口</title><desc id="desc">图中前两步是《通鉴》明载的行动，后两步是依据原文重建的决策关系；局部的急罚被挡下，不等于迎降总安排被改写；箭头表示先后和传递，不表示汲黯的建议必然能够改变政策。[[s1]] [[s2]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="191" height="164"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">国家扩大迎降成本</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">二万乘迎降，府库赏赐</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">，民间又被征马</text><text data-field="link-note" x="40" y="180" font-size="13px" fill="#647069">成本暴露</text><rect class="box" data-field="card" x="239" y="24" rx="8" width="191" height="164"/><text data-field="label" x="249" y="51" font-size="17px" fill="#285342">先挡下急罚</text><text data-field="detail" x="249" y="82" font-size="16px" fill="#26342e">汲黯称长安令无罪，武</text><text data-field="detail" x="249" y="105" font-size="16px" fill="#26342e">帝默然未许斩令</text><text data-field="link-note" x="249" y="180" font-size="13px" fill="#647069">局部惩罚暂止</text><rect class="box" data-field="card" x="448" y="24" rx="8" width="191" height="164"/><text data-field="label" x="458" y="51" font-size="17px" fill="#285342">把局部案带回总账</text><text data-field="detail" x="458" y="82" font-size="16px" fill="#26342e">指出战争、府库、百姓</text><text data-field="detail" x="458" y="105" font-size="16px" fill="#26342e">负担与法令之间的错位</text><text data-field="link-note" x="458" y="162" font-size="13px" fill="#647069">皇帝保留迎降安排与自身</text><text data-field="link-note" x="458" y="180" font-size="13px" fill="#647069">判断</text><rect class="box" data-field="card" x="657" y="24" rx="8" width="191" height="164"/><text data-field="label" x="667" y="51" font-size="17px" fill="#285342">总安排仍被保留</text><text data-field="detail" x="667" y="82" font-size="16px" fill="#26342e">武帝不采全案，称汲黯</text><text data-field="detail" x="667" y="105" font-size="16px" fill="#26342e">又在“妄发”</text><path class="line" d="M224 106H229"/><path d="m227 101 9 5-9 5z" fill="#285342"/><path class="line" d="M433 106H438"/><path d="m436 101 9 5-9 5z" fill="#285342"/><path class="line" d="M642 106H647"/><path d="m645 101 9 5-9 5z" fill="#285342"/></svg>