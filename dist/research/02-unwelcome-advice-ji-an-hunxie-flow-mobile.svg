<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 782" width="320" height="782"><title id="title">汲黯劝阻“迎降”安排：意见进入决定的四个关口</title><desc id="desc">图中前两步是《通鉴》明载的行动，后两步是依据原文重建的决策关系；局部的急罚被挡下，不等于迎降总安排被改写；箭头表示先后和传递，不表示汲黯的建议必然能够改变政策。[[s1]] [[s2]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="171"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">国家扩大迎降成本</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">二万乘迎降，府库赏赐，民间又被征</text><text data-field="detail" x="26" y="115" font-size="17px" fill="#26342e">马</text><text data-field="link-note" x="26" y="181" font-size="17px" fill="#647069">成本暴露</text><rect class="box" data-field="card" x="16" y="229" rx="8" width="288" height="171"/><text data-field="label" x="26" y="256" font-size="17px" fill="#285342">先挡下急罚</text><text data-field="detail" x="26" y="292" font-size="17px" fill="#26342e">汲黯称长安令无罪，武帝默然未许斩</text><text data-field="detail" x="26" y="320" font-size="17px" fill="#26342e">令</text><text data-field="link-note" x="26" y="386" font-size="17px" fill="#647069">局部惩罚暂止</text><rect class="box" data-field="card" x="16" y="434" rx="8" width="288" height="171"/><text data-field="label" x="26" y="461" font-size="17px" fill="#285342">把局部案带回总账</text><text data-field="detail" x="26" y="497" font-size="17px" fill="#26342e">指出战争、府库、百姓负担与法令之</text><text data-field="detail" x="26" y="525" font-size="17px" fill="#26342e">间的错位</text><text data-field="link-note" x="26" y="591" font-size="17px" fill="#647069">皇帝保留迎降安排与自身判断</text><rect class="box" data-field="card" x="16" y="639" rx="8" width="288" height="105"/><text data-field="label" x="26" y="666" font-size="17px" fill="#285342">总安排仍被保留</text><text data-field="detail" x="26" y="702" font-size="17px" fill="#26342e">武帝不采全案，称汲黯又在“妄发”</text><path class="line" d="M160 195V220"/><path d="m155 218 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 400V425"/><path d="m155 423 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 605V630"/><path d="m155 628 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>