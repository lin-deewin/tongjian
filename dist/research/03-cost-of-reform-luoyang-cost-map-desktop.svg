<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 364" width="880" height="364"><title id="title">迁都的四种成本：同一决定牵动不同系统</title><desc id="desc">前三行分别有卷140的同期记载支撑；最后一行主要依据卷150后524年广阳王深的后见性陈述，不能把它直接画成迁都导致六镇之乱。表格是定性比较，[[s4]]、[[s5]]、[[s7]]、[[s8]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">迁都带来的目标</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">先改变的对象</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">可见执行压力</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="68"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">运输与供给</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="68"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">打通四方之运，缓解京邑民</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">贫</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="68"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">平城的旧供给方式与京城位</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">置</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="68"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">水运风险、民众疑惧，需要</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">示范</text><rect class="box" data-field="cell" x="30" y="138" width="150" height="68"/><text data-field="cell" x="40" y="163" font-size="16px" fill="#26342e">政治任用</text><rect class="box" data-field="cell" x="180" y="138" width="223" height="68"/><text data-field="cell" x="190" y="163" font-size="16px" fill="#26342e">把中央重心置于洛阳及中州</text><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">网络</text><rect class="box" data-field="cell" x="403" y="138" width="223" height="68"/><text data-field="cell" x="413" y="163" font-size="16px" fill="#26342e">宗室、代人和旧镇将的地位</text><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">预期</text><rect class="box" data-field="cell" x="626" y="138" width="223" height="68"/><text data-field="cell" x="636" y="163" font-size="16px" fill="#26342e">反弹、结党、需要传达王意</text><rect class="box" data-field="cell" x="30" y="206" width="150" height="68"/><text data-field="cell" x="40" y="231" font-size="16px" fill="#26342e">军事行动</text><rect class="box" data-field="cell" x="180" y="206" width="223" height="68"/><text data-field="cell" x="190" y="231" font-size="16px" fill="#26342e">继续处理南方战事与外部压</text><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">力</text><rect class="box" data-field="cell" x="403" y="206" width="223" height="68"/><text data-field="cell" x="413" y="231" font-size="16px" fill="#26342e">新都的粮食与兵力调度</text><rect class="box" data-field="cell" x="626" y="206" width="223" height="68"/><text data-field="cell" x="636" y="231" font-size="16px" fill="#26342e">迁都尚新、秋谷不稔，行动</text><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">时机冲突</text><rect class="box" data-field="cell" x="30" y="274" width="150" height="68"/><text data-field="cell" x="40" y="299" font-size="16px" fill="#26342e">边镇关系</text><rect class="box" data-field="cell" x="180" y="274" width="223" height="68"/><text data-field="cell" x="190" 