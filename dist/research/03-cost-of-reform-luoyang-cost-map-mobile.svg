<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1186" width="320" height="1186"><title id="title">迁都的四种成本：同一决定牵动不同系统</title><desc id="desc">前三行分别有卷140的同期记载支撑；最后一行主要依据卷150后524年广阳王深的后见性陈述，不能把它直接画成迁都导致六镇之乱。表格是定性比较，[[s4]]、[[s5]]、[[s7]]、[[s8]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="260"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">运输与供给</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">迁都带来的目标</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">打通四方之运，缓解京邑民贫</text><text data-field="dimension" x="26" y="152" font-size="17px" fill="#285342">先改变的对象</text><text data-field="value" x="26" y="184" font-size="17px" fill="#26342e">平城的旧供给方式与京城位置</text><text data-field="dimension" x="26" y="220" font-size="17px" fill="#285342">可见执行压力</text><text data-field="value" x="26" y="252" font-size="17px" fill="#26342e">水运风险、民众疑惧，需要示范</text><rect class="box" data-field="case-card" x="16" y="296" rx="8" width="288" height="260"/><text data-field="case" x="26" y="322" font-size="17px" fill="#285342">政治任用</text><text data-field="dimension" x="26" y="358" font-size="17px" fill="#285342">迁都带来的目标</text><text data-field="value" x="26" y="390" font-size="17px" fill="#26342e">把中央重心置于洛阳及中州网络</text><text data-field="dimension" x="26" y="426" font-size="17px" fill="#285342">先改变的对象</text><text data-field="value" x="26" y="458" font-size="17px" fill="#26342e">宗室、代人和旧镇将的地位预期</text><text data-field="dimension" x="26" y="494" font-size="17px" fill="#285342">可见执行压力</text><text data-field="value" x="26" y="526" font-size="17px" fill="#26342e">反弹、结党、需要传达王意</text><rect class="box" data-field="case-card" x="16" y="570" rx="8" width="288" height="288"/><text data-field="case" x="26" y="596" font-size="17px" fill="#285342">军事行动</text><text data-field="dimension" x="26" y="632" font-size="17px" fill="#285342">迁都带来的目标</text><text data-field="value" x="26" y="664" font-size="17px" fill="#26342e">继续处理南方战事与外部压力</text><text data-field="dimension" x="26" y="700" font-size="17px" fill="#285342">先改变的对象</text><text data-field="value" x="26" y="732" font-size="17px" fill="#26342e">新都的粮食与兵力调度</text><text data-field="dimension" x="26" y="768" font-size="17px" fill="#285342">可见执行压力</text><text data-field="value" x="26" y="800" font-size="17px" fill="#26342e">迁都尚新、秋谷不稔，行动时机</text><text data-field="value" x="26" y="828" font-size="17px" fill="#26342e">冲突</text><rect class="box" data-field="case-card" x="16" y="872" rx="8" width="288" height="288"/><text data-field="case" x="26" y="898" font-size="17px" fill="#285342">边镇关系</text><text data-field="dimension" x="26" y="934" font-size="17px" fill="#285342">迁都带来的目标</text><text data-field="value" x="26" y="966" font-size="17px" fill="#26342e">让国家重心更接近中原</text><text data-field="dimension" x="26" y="1002" font-size="17px" fill="#285342">先改变的对象</text><text data-field="value" x="26" y="1034" font-size="17px" fill="#26342e">北边镇将与旧部族社会的连接</text><text data-field="dimension" x="26" y="1070" font-size="17px" fill="#285342">可见执行压力</text><text data-field="value" x="26" y="1102" font-size="17px" fill="#26342e">长期待遇和仕途差异可能累积不</text><text data-field="value" x="26" y="1130" font-size="17px" fill="#26342e">满</text></svg>