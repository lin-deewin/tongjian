<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 360" width="880" height="360"><title id="title">判断改革阻力的四个问题</title><desc id="desc">表中是作者对史料的结构化比较，不是给改革打分。赵武灵王的军事效果不能由这几段直接穷尽；迁都与六镇之乱的关系必须保留不确定性；王莽时期的旱蝗、饥馑等另有原因。依据[[s3]]、[[s5]]、[[s6]]、[[s8]]、[[s13]]、[[s14]]、[[s15]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">赵武灵王</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">孝文帝迁都</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">王莽改制</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="66"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">目标争议</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="66"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">边患与战备说得具体</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="66"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">运输、京城与南方压力并存</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="66"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">抑兼并、整货币等目标并存</text><rect class="box" data-field="cell" x="30" y="136" width="150" height="66"/><text data-field="cell" x="40" y="161" font-size="16px" fill="#26342e">身份/利益变化</text><rect class="box" data-field="cell" x="180" y="136" width="223" height="66"/><text data-field="cell" x="190" y="161" font-size="16px" fill="#26342e">华夏衣冠与贵族示范</text><rect class="box" data-field="cell" x="403" y="136" width="223" height="66"/><text data-field="cell" x="413" y="161" font-size="16px" fill="#26342e">宗室、代人及边镇地位预期</text><rect class="box" data-field="cell" x="626" y="136" width="223" height="66"/><text data-field="cell" x="636" y="161" font-size="16px" fill="#26342e">田宅、奴婢和交易惯例改变</text><rect class="box" data-field="cell" x="30" y="202" width="150" height="68"/><text data-field="cell" x="40" y="227" font-size="16px" fill="#26342e">执行成本</text><rect class="box" data-field="cell" x="180" y="202" width="223" height="68"/><text data-field="cell" x="190" y="227" font-size="16px" fill="#26342e">训练和组织仍需后续建设</text><rect class="box" data-field="cell" x="403" y="202" width="223" height="68"/><text data-field="cell" x="413" y="227" font-size="16px" fill="#26342e">迁都、粮运、用兵争用资源</text><rect class="box" data-field="cell" x="626" y="202" width="223" height="68"/><text data-field="cell" x="636" y="227" font-size="16px" fill="#26342e">登记、禁令、监管链条负荷</text><text data-field="cell" x="636" y="250" font-size="16px" fill="#26342e">高</text><rect class="box" data-field="cell" x="30" y="270" width="150" height="68"/><text data-field="cell" x="40" y="295" font-size="16px" fill="#26342e">纠错条件</text><rect class="box" data-field="cell" x="180" y="270" width="223" height="68"/><text data-field="cell" x="190" y="295" font-size="16px" fill="#26342e">王亲自请公子成，先取得示</text><text data-field="cell" x="190" y="318" font-size="16px" fill="#26342e">范</text><rect class="box" data-field="cell" x="403" y="270" width="223" height="68"/><text data-field="cell" x="413" y="295" font-size="16px" fill="#26342e">任城王澄传达王意并分化叛</text><text data-field="cell" x="413" y="318" font-size="16px" fill="#26342e">党</text><rect class="box" data-field="cell" x="626" y="270" width="223" height="68"/><text data-field="cell" x="636" y="295" font-size="16px" fill="#26342e">费兴、公孙禄的坏消息受压</text><text data-field="cell" x="636" y="318" font-size="16px" fill="#26342e">制</text></svg>