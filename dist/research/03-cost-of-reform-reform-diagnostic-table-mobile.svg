<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1130" width="320" height="1130"><title id="title">判断改革阻力的四个问题</title><desc id="desc">表中是作者对史料的结构化比较，不是给改革打分。赵武灵王的军事效果不能由这几段直接穷尽；迁都与六镇之乱的关系必须保留不确定性；王莽时期的旱蝗、饥馑等另有原因。依据[[s3]]、[[s5]]、[[s6]]、[[s8]]、[[s13]]、[[s14]]、[[s15]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="260"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">目标争议</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">赵武灵王</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">边患与战备说得具体</text><text data-field="dimension" x="26" y="152" font-size="17px" fill="#285342">孝文帝迁都</text><text data-field="value" x="26" y="184" font-size="17px" fill="#26342e">运输、京城与南方压力并存</text><text data-field="dimension" x="26" y="220" font-size="17px" fill="#285342">王莽改制</text><text data-field="value" x="26" y="252" font-size="17px" fill="#26342e">抑兼并、整货币等目标并存</text><rect class="box" data-field="case-card" x="16" y="296" rx="8" width="288" height="260"/><text data-field="case" x="26" y="322" font-size="17px" fill="#285342">身份/利益变化</text><text data-field="dimension" x="26" y="358" font-size="17px" fill="#285342">赵武灵王</text><text data-field="value" x="26" y="390" font-size="17px" fill="#26342e">华夏衣冠与贵族示范</text><text data-field="dimension" x="26" y="426" font-size="17px" fill="#285342">孝文帝迁都</text><text data-field="value" x="26" y="458" font-size="17px" fill="#26342e">宗室、代人及边镇地位预期</text><text data-field="dimension" x="26" y="494" font-size="17px" fill="#285342">王莽改制</text><text data-field="value" x="26" y="526" font-size="17px" fill="#26342e">田宅、奴婢和交易惯例改变</text><rect class="box" data-field="case-card" x="16" y="570" rx="8" width="288" height="260"/><text data-field="case" x="26" y="596" font-size="17px" fill="#285342">执行成本</text><text data-field="dimension" x="26" y="632" font-size="17px" fill="#285342">赵武灵王</text><text data-field="value" x="26" y="664" font-size="17px" fill="#26342e">训练和组织仍需后续建设</text><text data-field="dimension" x="26" y="700" font-size="17px" fill="#285342">孝文帝迁都</text><text data-field="value" x="26" y="732" font-size="17px" fill="#26342e">迁都、粮运、用兵争用资源</text><text data-field="dimension" x="26" y="768" font-size="17px" fill="#285342">王莽改制</text><text data-field="value" x="26" y="800" font-size="17px" fill="#26342e">登记、禁令、监管链条负荷高</text><rect class="box" data-field="case-card" x="16" y="844" rx="8" width="288" height="260"/><text data-field="case" x="26" y="870" font-size="17px" fill="#285342">纠错条件</text><text data-field="dimension" x="26" y="906" font-size="17px" fill="#285342">赵武灵王</text><text data-field="value" x="26" y="938" font-size="17px" fill="#26342e">王亲自请公子成，先取得示范</text><text data-field="dimension" x="26" y="974" font-size="17px" fill="#285342">孝文帝迁都</text><text data-field="value" x="26" y="1006" font-size="17px" fill="#26342e">任城王澄传达王意并分化叛党</text><text data-field="dimension" x="26" y="1042" font-size="17px" fill="#285342">王莽改制</text><text data-field="value" x="26" y="1074" font-size="17px" fill="#26342e">费兴、公孙禄的坏消息受压制</text></svg>