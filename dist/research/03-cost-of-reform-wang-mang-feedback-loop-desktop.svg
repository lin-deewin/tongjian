<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 235" width="880" height="235"><title id="title">王莽改制中的反馈回路：理念如何变成执行压力</title><desc id="desc">这是作者依据多处史料重建的分析示意，不是王莽朝廷实际列出的流程。前四步可由王田、宝货与六筦记载分别支持；最后一步还受到旱蝗、饥馑和地方治理等因素影响，不能将所有灾害归因于改制。[[s11]]、[[s12]]、[[s13]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="149" height="187"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">目标被制度化</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">抑兼并、整货币、</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">控制资源，形成新</text><text data-field="detail" x="40" y="128" font-size="16px" fill="#26342e">名目与禁令</text><text data-field="link-note" x="40" y="185" font-size="13px" fill="#647069">说明目标如何进入</text><text data-field="link-note" x="40" y="203" font-size="13px" fill="#647069">行政系统</text><rect class="box" data-field="card" x="197" y="24" rx="8" width="149" height="187"/><text data-field="label" x="207" y="51" font-size="17px" fill="#285342">地方执行变复杂</text><text data-field="detail" x="207" y="82" font-size="16px" fill="#26342e">土地、钱币和六筦</text><text data-field="detail" x="207" y="105" font-size="16px" fill="#26342e">需要大量登记、监</text><text data-field="detail" x="207" y="128" font-size="16px" fill="#26342e">督与解释</text><text data-field="link-note" x="207" y="185" font-size="13px" fill="#647069">说明执行链条的负</text><text data-field="link-note" x="207" y="203" font-size="13px" fill="#647069">荷</text><rect class="box" data-field="card" x="364" y="24" rx="8" width="149" height="187"/><text data-field="label" x="374" y="51" font-size="17px" fill="#285342">不确定性上升</text><text data-field="detail" x="374" y="82" font-size="16px" fill="#26342e">规则变更、旧惯例</text><text data-field="detail" x="374" y="105" font-size="16px" fill="#26342e">仍在，交易和耕作</text><text data-field="detail" x="374" y="128" font-size="16px" fill="#26342e">更难安排</text><text data-field="link-note" x="374" y="185" font-size="13px" fill="#647069">说明切换速度改变</text><text data-field="link-note" x="374" y="203" font-size="13px" fill="#647069">预期</text><rect class="box" data-field="card" x="531" y="24" rx="8" width="149" height="187"/><text data-field="label" x="541" y="51" font-size="17px" fill="#285342">处罚替代纠错</text><text data-field="detail" x="541" y="82" font-size="16px" fill="#26342e">反馈受压后，禁令</text><text data-field="detail" x="541" y="105" font-size="16px" fill="#26342e">与追究继续加码</text><text data-field="link-note" x="541" y="185" font-size="13px" fill="#647069">说明纠错通道受阻</text><text data-field="link-note" x="541" y="203" font-size="13px" fill="#647069">后的选择</text><rect class="box" data-field="card" x="698" y="24" rx="8" width="149" height="187"/><text data-field="label" x="708" y="51" font-size="17px" fill="#285342">成本扩散</text><text data-field="detail" x="708" y="82" font-size="16px" fill="#26342e">商农失业、民众困</text><text data-field="detail" x="708" y="105" font-size="16px" fill="#26342e">穷与盗贼扩大，但</text><text data-field="detail" x="708" y="128" font-size="16px" fill="#26342e">灾害亦并存</text><path class="line" d="M182 117H187"/><path d="m185 112 9 5-9 5z" fill="#285342"/><path class="line" d="M349 117H354"/><path d="m352 112 9 5-9 5z" fill="#285342"/><path class="line" d="M516 117H521"/><path d="m519 112 9 5-9 5z" fill="#285342"/><path class="line" d="M683 117H688"/><path d="m686 112 9 5-9 5z" fill="#285342"/></svg>