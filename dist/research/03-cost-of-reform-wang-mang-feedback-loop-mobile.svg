<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 987" width="320" height="987"><title id="title">王莽改制中的反馈回路：理念如何变成执行压力</title><desc id="desc">这是作者依据多处史料重建的分析示意，不是王莽朝廷实际列出的流程。前四步可由王田、宝货与六筦记载分别支持；最后一步还受到旱蝗、饥馑和地方治理等因素影响，不能将所有灾害归因于改制。[[s11]]、[[s12]]、[[s13]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="171"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">目标被制度化</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">抑兼并、整货币、控制资源，形成新</text><text data-field="detail" x="26" y="115" font-size="17px" fill="#26342e">名目与禁令</text><text data-field="link-note" x="26" y="181" font-size="17px" fill="#647069">说明目标如何进入行政系统</text><rect class="box" data-field="card" x="16" y="229" rx="8" width="288" height="171"/><text data-field="label" x="26" y="256" font-size="17px" fill="#285342">地方执行变复杂</text><text data-field="detail" x="26" y="292" font-size="17px" fill="#26342e">土地、钱币和六筦需要大量登记、监</text><text data-field="detail" x="26" y="320" font-size="17px" fill="#26342e">督与解释</text><text data-field="link-note" x="26" y="386" font-size="17px" fill="#647069">说明执行链条的负荷</text><rect class="box" data-field="card" x="16" y="434" rx="8" width="288" height="171"/><text data-field="label" x="26" y="461" font-size="17px" fill="#285342">不确定性上升</text><text data-field="detail" x="26" y="497" font-size="17px" fill="#26342e">规则变更、旧惯例仍在，交易和耕作</text><text data-field="detail" x="26" y="525" font-size="17px" fill="#26342e">更难安排</text><text data-field="link-note" x="26" y="591" font-size="17px" fill="#647069">说明切换速度改变预期</text><rect class="box" data-field="card" x="16" y="639" rx="8" width="288" height="143"/><text data-field="label" x="26" y="666" font-size="17px" fill="#285342">处罚替代纠错</text><text data-field="detail" x="26" y="702" font-size="17px" fill="#26342e">反馈受压后，禁令与追究继续加码</text><text data-field="link-note" x="26" y="768" font-size="17px" fill="#647069">说明纠错通道受阻后的选择</text><rect class="box" data-field="card" x="16" y="816" rx="8" width="288" height="133"/><text data-field="label" x="26" y="843" font-size="17px" fill="#285342">成本扩散</text><text data-field="detail" x="26" y="879" font-size="17px" fill="#26342e">商农失业、民众困穷与盗贼扩大，但</text><text data-field="detail" x="26" y="907" font-size="17px" fill="#26342e">灾害亦并存</text><path class="line" d="M160 195V220"/><path d="m155 218 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 400V425"/><path d="m155 423 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 605V630"/><path d="m155 628 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 782V807"/><path d="m155 805 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>