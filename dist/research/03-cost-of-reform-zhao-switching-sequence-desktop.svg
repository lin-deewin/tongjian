<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 194" width="880" height="194"><title id="title">胡服骑射的切换顺序：从安全目标到贵族示范</title><desc id="desc">图中箭头表示《通鉴》所载行动先后，不表示胡服骑射因此必然带来赵国后来所有成果。前两步是史料记载，后两步也有明确记载；“先示范再普及”是对这组顺序的分析概括，依据为[[s2]]、[[s3]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="191" height="146"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">边患被重新定义</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">赵王把中山围鄗和四境</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">邻国列为现实压力</text><text data-field="link-note" x="40" y="162" font-size="13px" fill="#647069">说明改革目标的提出背景</text><rect class="box" data-field="card" x="239" y="24" rx="8" width="191" height="146"/><text data-field="label" x="249" y="51" font-size="17px" fill="#285342">旧身份提出异议</text><text data-field="detail" x="249" y="82" font-size="16px" fill="#26342e">公子成以礼制、华夏身</text><text data-field="detail" x="249" y="105" font-size="16px" fill="#26342e">份和人心质疑变服</text><text data-field="link-note" x="249" y="162" font-size="13px" fill="#647069">说明身份与秩序成本</text><rect class="box" data-field="card" x="448" y="24" rx="8" width="191" height="146"/><text data-field="label" x="458" y="51" font-size="17px" fill="#285342">最高权力亲自说服</text><text data-field="detail" x="458" y="82" font-size="16px" fill="#26342e">赵王亲往请公子成，先</text><text data-field="detail" x="458" y="105" font-size="16px" fill="#26342e">争取关键贵族</text><text data-field="link-note" x="458" y="162" font-size="13px" fill="#647069">说明争取关键节点的办法</text><rect class="box" data-field="card" x="657" y="24" rx="8" width="191" height="146"/><text data-field="label" x="667" y="51" font-size="17px" fill="#285342">示范后发布命令</text><text data-field="detail" x="667" y="82" font-size="16px" fill="#26342e">公子成受服朝见，随后</text><text data-field="detail" x="667" y="105" font-size="16px" fill="#26342e">才正式招募骑射</text><path class="line" d="M224 97H229"/><path d="m227 92 9 5-9 5z" fill="#285342"/><path class="line" d="M433 97H438"/><path d="m436 92 9 5-9 5z" fill="#285342"/><path class="line" d="M642 97H647"/><path d="m645 92 9 5-9 5z" fill="#285342"/></svg>