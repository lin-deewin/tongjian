<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 782" width="320" height="782"><title id="title">胡服骑射的切换顺序：从安全目标到贵族示范</title><desc id="desc">图中箭头表示《通鉴》所载行动先后，不表示胡服骑射因此必然带来赵国后来所有成果。前两步是史料记载，后两步也有明确记载；“先示范再普及”是对这组顺序的分析概括，依据为[[s2]]、[[s3]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="171"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">边患被重新定义</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">赵王把中山围鄗和四境邻国列为现实</text><text data-field="detail" x="26" y="115" font-size="17px" fill="#26342e">压力</text><text data-field="link-note" x="26" y="181" font-size="17px" fill="#647069">说明改革目标的提出背景</text><rect class="box" data-field="card" x="16" y="229" rx="8" width="288" height="171"/><text data-field="label" x="26" y="256" font-size="17px" fill="#285342">旧身份提出异议</text><text data-field="detail" x="26" y="292" font-size="17px" fill="#26342e">公子成以礼制、华夏身份和人心质疑</text><text data-field="detail" x="26" y="320" font-size="17px" fill="#26342e">变服</text><text data-field="link-note" x="26" y="386" font-size="17px" fill="#647069">说明身份与秩序成本</text><rect class="box" data-field="card" x="16" y="434" rx="8" width="288" height="143"/><text data-field="label" x="26" y="461" font-size="17px" fill="#285342">最高权力亲自说服</text><text data-field="detail" x="26" y="497" font-size="17px" fill="#26342e">赵王亲往请公子成，先争取关键贵族</text><text data-field="link-note" x="26" y="563" font-size="17px" fill="#647069">说明争取关键节点的办法</text><rect class="box" data-field="card" x="16" y="611" rx="8" width="288" height="133"/><text data-field="label" x="26" y="638" font-size="17px" fill="#285342">示范后发布命令</text><text data-field="detail" x="26" y="674" font-size="17px" fill="#26342e">公子成受服朝见，随后才正式招募骑</text><text data-field="detail" x="26" y="702" font-size="17px" fill="#26342e">射</text><path class="line" d="M160 195V220"/><path d="m155 218 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 400V425"/><path d="m155 423 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 577V602"/><path d="m155 600 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>