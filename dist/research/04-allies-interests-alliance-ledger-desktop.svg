<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 342" width="880" height="342"><title id="title">三种同盟中的收益与约束账本</title><desc id="desc">这是基于史料的定性比较，不是给盟友关系打分。每格分别说明合作立即解决的难题、合作改变的力量关系与退出成本；唐案中“资源所得”部分是作者根据军需、路线和战场行动重建的议价空间。依据 [[s2]] [[s4]] [[s6]] [[s8]] [[s9]] [[s10]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">合作立即解决什么</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">合作后谁获得新筹码</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">退出或改约的成本</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="68"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">六国合纵</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="68"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">把秦的逐国压力转成互救承</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">诺</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="68"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">任何一国的边境与兵力都影</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">响全局</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="68"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">一国求和会削弱共同屏障，</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">也可能先换来本国喘息</text><rect class="box" data-field="cell" x="30" y="138" width="150" height="91"/><text data-field="cell" x="40" y="163" font-size="16px" fill="#26342e">孙刘联盟</text><rect class="box" data-field="cell" x="180" y="138" width="223" height="91"/><text data-field="cell" x="190" y="163" font-size="16px" fill="#26342e">共同抗曹，整合江东与荆州</text><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">的临战资源</text><rect class="box" data-field="cell" x="403" y="138" width="223" height="91"/><text data-field="cell" x="413" y="163" font-size="16px" fill="#26342e">战后荆州、益州和长江上下</text><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">游的归属更重要</text><rect class="box" data-field="cell" x="626" y="138" width="223" height="91"/><text data-field="cell" x="636" y="163" font-size="16px" fill="#26342e">立即拆盟会给曹操机会，但</text><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">继续合作也会放大盟友的地</text><text data-field="cell" x="636" y="209" font-size="16px" fill="#26342e">缘优势</text><rect class="box" data-field="cell" x="30" y="229" width="150" height="91"/><text data-field="cell" x="40" y="254" font-size="16px" fill="#26342e">唐与回纥</text><rect class="box" data-field="cell" x="180" y="229" width="223" height="91"/><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">唐急需骑兵和外援，回纥获</text><text data-field="cell" x="190" y="277" font-size="16px" fill="#26342e">得介入中原的议价位置</text><rect class="box" data-field="cell" x="403" y="229" width="223" height="91"/><text data-field="cell" x="413" y="254" font-size="16px" fill="#26342e">援军取得战果，并获得军需</text><text data-field="cell" x="413" y="277" font-size="16px" fill="#26342e">、路线与礼遇的议价空间</text><rect class="box" data-field="cell" x="626" y="229" width="223" height="91"/><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">拒绝回纥会失去援军，接受</text><text data-field="cell" x="636" y="277" font-size="16px" fill="#26342e">其条件又要承担供应与边患</text><text data-field="cell" x="636" y="300" font-size="16px" fill="#26342e">压力</text></svg>