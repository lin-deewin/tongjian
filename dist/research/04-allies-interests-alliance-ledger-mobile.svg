<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1080" width="320" height="1080"><title id="title">三种同盟中的收益与约束账本</title><desc id="desc">这是基于史料的定性比较，不是给盟友关系打分。每格分别说明合作立即解决的难题、合作改变的力量关系与退出成本；唐案中“资源所得”部分是作者根据军需、路线和战场行动重建的议价空间。依据 [[s2]] [[s4]] [[s6]] [[s8]] [[s9]] [[s10]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="316"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">六国合纵</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">合作立即解决什么</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">把秦的逐国压力转成互救承诺</text><text data-field="dimension" x="26" y="152" font-size="17px" fill="#285342">合作后谁获得新筹码</text><text data-field="value" x="26" y="184" font-size="17px" fill="#26342e">任何一国的边境与兵力都影响全</text><text data-field="value" x="26" y="212" font-size="17px" fill="#26342e">局</text><text data-field="dimension" x="26" y="248" font-size="17px" fill="#285342">退出或改约的成本</text><text data-field="value" x="26" y="280" font-size="17px" fill="#26342e">一国求和会削弱共同屏障，也可</text><text data-field="value" x="26" y="308" font-size="17px" fill="#26342e">能先换来本国喘息</text><rect class="box" data-field="case-card" x="16" y="352" rx="8" width="288" height="344"/><text data-field="case" x="26" y="378" font-size="17px" fill="#285342">孙刘联盟</text><text data-field="dimension" x="26" y="414" font-size="17px" fill="#285342">合作立即解决什么</text><text data-field="value" x="26" y="446" font-size="17px" fill="#26342e">共同抗曹，整合江东与荆州的临</text><text data-field="value" x="26" y="474" font-size="17px" fill="#26342e">战资源</text><text data-field="dimension" x="26" y="510" font-size="17px" fill="#285342">合作后谁获得新筹码</text><text data-field="value" x="26" y="542" font-size="17px" fill="#26342e">战后荆州、益州和长江上下游的</text><text data-field="value" x="26" y="570" font-size="17px" fill="#26342e">归属更重要</text><text data-field="dimension" x="26" y="606" font-size="17px" fill="#285342">退出或改约的成本</text><text data-field="value" x="26" y="638" font-size="17px" fill="#26342e">立即拆盟会给曹操机会，但继续</text><text data-field="value" x="26" y="666" font-size="17px" fill="#26342e">合作也会放大盟友的地缘优势</text><rect class="box" data-field="case-card" x="16" y="710" rx="8" width="288" height="344"/><text data-field="case" x="26" y="736" font-size="17px" fill="#285342">唐与回纥</text><text data-field="dimension" x="26" y="772" font-size="17px" fill="#285342">合作立即解决什么</text><text data-field="value" x="26" y="804" font-size="17px" fill="#26342e">唐急需骑兵和外援，回纥获得介</text><text data-field="value" x="26" y="832" font-size="17px" fill="#26342e">入中原的议价位置</text><text data-field="dimension" x="26" y="868" font-size="17px" fill="#285342">合作后谁获得新筹码</text><text data-field="value" x="26" y="900" font-size="17px" fill="#26342e">援军取得战果，并获得军需、路</text><text data-field="value" x="26" y="928" font-size="17px" fill="#26342e">线与礼遇的议价空间</text><text data-field="dimension" x="26" y="964" font-size="17px" fill="#285342">退出或改约的成本</text><text data-field="value" x="26" y="996" font-size="17px" fill="#26342e">拒绝回纥会失去援军，接受其条</text><text data-field="value" x="26" y="1024" font-size="17px" fill="#26342e">件又要承担供应与边患压力</text></svg>