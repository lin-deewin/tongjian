<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 514" width="880" height="514"><title id="title">从求援到再谈判：唐与回纥的合作如何改变条件</title><desc id="desc">事件顺序依据《通鉴》编年；图中“改变议价”是作者对已载行动的分析，不等于史书直接给出的单一因果。756—762年间的具体发生时间以相关条目为准，依据 [[s9]] [[s10]] [[s11]] [[s12]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><path class="line" d="M65 37V490"/><circle data-field="event" cx="65" cy="37" r="8" fill="#285342"/><text data-field="event-label" x="83" y="42" font-size="17px" fill="#285342">756年，求援阶段 · 唐遣使请兵</text><text data-field="detail" x="83" y="73" font-size="16px" fill="#26342e">唐处于危机，婚姻与厚礼建立外交纽带</text><circle data-field="event" cx="65" cy="133" r="8" fill="#285342"/><text data-field="event-label" x="83" y="138" font-size="17px" fill="#285342">756年，河曲 · 首次合军取胜</text><text data-field="detail" x="83" y="169" font-size="16px" fill="#26342e">回纥骑兵与郭子仪军合，击破同罗及叛胡</text><circle data-field="event" cx="65" cy="229" r="8" fill="#285342"/><text data-field="event-label" x="83" y="234" font-size="17px" fill="#285342">757年，两京战场 · 协同收复长安洛阳</text><text data-field="detail" x="83" y="265" font-size="16px" fill="#26342e">回纥袭背，唐军夹击，合作收益具体兑现</text><circle data-field="event" cx="65" cy="325" r="8" fill="#285342"/><text data-field="event-label" x="83" y="330" font-size="17px" fill="#285342">762年，重新请兵 · 回纥先受诱而疑唐</text><text data-field="detail" x="83" y="361" font-size="16px" fill="#26342e">中原残破与权力更替提高了援军的退出与议价成本</text><circle data-field="event" cx="65" cy="421" r="8" fill="#285342"/><text data-field="event-label" x="83" y="426" font-size="17px" fill="#285342">762年，再次结盟 · 重申旧恩与身份</text><text data-field="detail" x="83" y="457" font-size="16px" fill="#26342e">唐以旧日共同作战和恩信说服可汗恢复合作</text></svg>