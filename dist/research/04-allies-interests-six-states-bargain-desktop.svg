<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 235" width="880" height="235"><title id="title">合纵条款如何在执行次序中失去力量</title><desc id="desc">图中箭头表示条款要求的先后关系，不等于历史必然因果。上层是合纵承诺的设计，下层是各国在边境压力下重新计算的实际次序；依据 [[s2]] [[s3]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="149" height="187"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">共同威胁</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">秦可逐国进攻，单</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">国承担代价过高</text><text data-field="link-note" x="40" y="185" font-size="13px" fill="#647069">把分散威胁转为共</text><text data-field="link-note" x="40" y="203" font-size="13px" fill="#647069">同条款</text><rect class="box" data-field="card" x="197" y="24" rx="8" width="149" height="187"/><text data-field="label" x="207" y="51" font-size="17px" fill="#285342">互相救援</text><text data-field="detail" x="207" y="82" font-size="16px" fill="#26342e">五国出兵牵制或救</text><text data-field="detail" x="207" y="105" font-size="16px" fill="#26342e">援被攻者</text><text data-field="link-note" x="207" y="185" font-size="13px" fill="#647069">从共同条款转为本</text><text data-field="link-note" x="207" y="203" font-size="13px" fill="#647069">国优先</text><rect class="box" data-field="card" x="364" y="24" rx="8" width="149" height="187"/><text data-field="label" x="374" y="51" font-size="17px" fill="#285342">先问本国边境</text><text data-field="detail" x="374" y="82" font-size="16px" fill="#26342e">各国先判断眼前战</text><text data-field="detail" x="374" y="105" font-size="16px" fill="#26342e">场是否会失守</text><text data-field="link-note" x="374" y="185" font-size="13px" fill="#647069">本国优先使救援难</text><text data-field="link-note" x="374" y="203" font-size="13px" fill="#647069">以同步</text><rect class="box" data-field="card" x="531" y="24" rx="8" width="149" height="187"/><text data-field="label" x="541" y="51" font-size="17px" fill="#285342">协调成本上升</text><text data-field="detail" x="541" y="82" font-size="16px" fill="#26342e">兵力、时间与惩罚</text><text data-field="detail" x="541" y="105" font-size="16px" fill="#26342e">违约都缺少共同执</text><text data-field="detail" x="541" y="128" font-size="16px" fill="#26342e">行者</text><text data-field="link-note" x="541" y="185" font-size="13px" fill="#647069">违约难惩又削弱下</text><text data-field="link-note" x="541" y="203" font-size="13px" fill="#647069">一次合作</text><rect class="box" data-field="card" x="698" y="24" rx="8" width="149" height="187"/><text data-field="label" x="708" y="51" font-size="17px" fill="#285342">承诺变薄</text><text data-field="detail" x="708" y="82" font-size="16px" fill="#26342e">某国求和后，其他</text><text data-field="detail" x="708" y="105" font-size="16px" fill="#26342e">国家的安全预期一</text><text data-field="detail" x="708" y="128" font-size="16px" fill="#26342e">起下降</text><path class="line" d="M182 117H187"/><path d="m185 112 9 5-9 5z" fill="#285342"/><path class="line" d="M349 117H354"/><path d="m352 112 9 5-9 5z" fill="#285342"/><path class="line" d="M516 117H521"/><path d="m519 112 9 5-9 5z" fill="#285342"/><path class="line" d="M683 117H688"/><path d="m686 112 9 5-9 5z" fill="#285342"/></svg>