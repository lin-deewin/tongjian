<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 931" width="320" height="931"><title id="title">合纵条款如何在执行次序中失去力量</title><desc id="desc">图中箭头表示条款要求的先后关系，不等于历史必然因果。上层是合纵承诺的设计，下层是各国在边境压力下重新计算的实际次序；依据 [[s2]] [[s3]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="143"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">共同威胁</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">秦可逐国进攻，单国承担代价过高</text><text data-field="link-note" x="26" y="153" font-size="17px" fill="#647069">把分散威胁转为共同条款</text><rect class="box" data-field="card" x="16" y="201" rx="8" width="288" height="143"/><text data-field="label" x="26" y="228" font-size="17px" fill="#285342">互相救援</text><text data-field="detail" x="26" y="264" font-size="17px" fill="#26342e">五国出兵牵制或救援被攻者</text><text data-field="link-note" x="26" y="330" font-size="17px" fill="#647069">从共同条款转为本国优先</text><rect class="box" data-field="card" x="16" y="378" rx="8" width="288" height="143"/><text data-field="label" x="26" y="405" font-size="17px" fill="#285342">先问本国边境</text><text data-field="detail" x="26" y="441" font-size="17px" fill="#26342e">各国先判断眼前战场是否会失守</text><text data-field="link-note" x="26" y="507" font-size="17px" fill="#647069">本国优先使救援难以同步</text><rect class="box" data-field="card" x="16" y="555" rx="8" width="288" height="171"/><text data-field="label" x="26" y="582" font-size="17px" fill="#285342">协调成本上升</text><text data-field="detail" x="26" y="618" font-size="17px" fill="#26342e">兵力、时间与惩罚违约都缺少共同执</text><text data-field="detail" x="26" y="646" font-size="17px" fill="#26342e">行者</text><text data-field="link-note" x="26" y="712" font-size="17px" fill="#647069">违约难惩又削弱下一次合作</text><rect class="box" data-field="card" x="16" y="760" rx="8" width="288" height="133"/><text data-field="label" x="26" y="787" font-size="17px" fill="#285342">承诺变薄</text><text data-field="detail" x="26" y="823" font-size="17px" fill="#26342e">某国求和后，其他国家的安全预期一</text><text data-field="detail" x="26" y="851" font-size="17px" fill="#26342e">起下降</text><path class="line" d="M160 167V192"/><path d="m155 190 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 344V369"/><path d="m155 367 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 521V546"/><path d="m155 544 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 726V751"/><path d="m155 749 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>