<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 296" width="880" height="296"><title id="title">偏爱何时会转成继承风险？</title><desc id="desc">这是根据三案史料重建的定性比较，不是对人物动机或风险的量化评分。每一列都应与名分、资源、沟通和组织化分别核对；箭头式因果不能从单一案例直接推出。[[s1]][[s4]][[s7]][[s10]][[s11]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">名分状态</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">父亲的偏爱如何被看见</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">站队为何形成</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="68"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">刘表二子</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="68"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">生前未见公开定案；死后由</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">近臣立琮</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="68"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">近臣毁琦誉琮；刘琦被阻于</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">病榻之外</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="68"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">江夏、襄阳、消息渠道与外</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">敌压力同时存在</text><rect class="box" data-field="cell" x="30" y="138" width="150" height="68"/><text data-field="cell" x="40" y="163" font-size="16px" fill="#26342e">曹操诸子</text><rect class="box" data-field="cell" x="180" y="138" width="223" height="68"/><text data-field="cell" x="190" y="163" font-size="16px" fill="#26342e">嫡长规则与植的才名竞争；</text><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">后立丕为太子</text><rect class="box" data-field="cell" x="403" y="138" width="223" height="68"/><text data-field="cell" x="413" y="163" font-size="16px" fill="#26342e">送行场合和近臣评价放大两</text><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">人表现</text><rect class="box" data-field="cell" x="626" y="138" width="223" height="68"/><text data-field="cell" x="636" y="163" font-size="16px" fill="#26342e">杨修、丁仪等结党；机密泄</text><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">露提高政治成本</text><rect class="box" data-field="cell" x="30" y="206" width="150" height="68"/><text data-field="cell" x="40" y="231" font-size="16px" fill="#26342e">承乾与李泰</text><rect class="box" data-field="cell" x="180" y="206" width="223" height="68"/><text data-field="cell" x="190" y="231" font-size="16px" fill="#26342e">承乾已立，但泰月给越嫡、</text><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">招士获宠</text><rect class="box" data-field="cell" x="403" y="206" width="223" height="68"/><text data-field="cell" x="413" y="231" font-size="16px" fill="#26342e">泰经营朝士，承乾反制并养</text><text data-field="cell" x="413" y="254" font-size="16px" fill="#26342e">刺客</text><rect class="box" data-field="cell" x="626" y="206" width="223" height="68"/><text data-field="cell" x="636" y="231" font-size="16px" fill="#26342e">名分、财用、门客和父亲摇</text><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">摆共同制造逼迫感</text></svg>