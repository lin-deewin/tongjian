<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1080" width="320" height="1080"><title id="title">偏爱何时会转成继承风险？</title><desc id="desc">这是根据三案史料重建的定性比较，不是对人物动机或风险的量化评分。每一列都应与名分、资源、沟通和组织化分别核对；箭头式因果不能从单一案例直接推出。[[s1]][[s4]][[s7]][[s10]][[s11]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="344"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">刘表二子</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">名分状态</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">生前未见公开定案；死后由近臣</text><text data-field="value" x="26" y="144" font-size="17px" fill="#26342e">立琮</text><text data-field="dimension" x="26" y="180" font-size="17px" fill="#285342">父亲的偏爱如何被看见</text><text data-field="value" x="26" y="212" font-size="17px" fill="#26342e">近臣毁琦誉琮；刘琦被阻于病榻</text><text data-field="value" x="26" y="240" font-size="17px" fill="#26342e">之外</text><text data-field="dimension" x="26" y="276" font-size="17px" fill="#285342">站队为何形成</text><text data-field="value" x="26" y="308" font-size="17px" fill="#26342e">江夏、襄阳、消息渠道与外敌压</text><text data-field="value" x="26" y="336" font-size="17px" fill="#26342e">力同时存在</text><rect class="box" data-field="case-card" x="16" y="380" rx="8" width="288" height="344"/><text data-field="case" x="26" y="406" font-size="17px" fill="#285342">曹操诸子</text><text data-field="dimension" x="26" y="442" font-size="17px" fill="#285342">名分状态</text><text data-field="value" x="26" y="474" font-size="17px" fill="#26342e">嫡长规则与植的才名竞争；后立</text><text data-field="value" x="26" y="502" font-size="17px" fill="#26342e">丕为太子</text><text data-field="dimension" x="26" y="538" font-size="17px" fill="#285342">父亲的偏爱如何被看见</text><text data-field="value" x="26" y="570" font-size="17px" fill="#26342e">送行场合和近臣评价放大两人表</text><text data-field="value" x="26" y="598" font-size="17px" fill="#26342e">现</text><text data-field="dimension" x="26" y="634" font-size="17px" fill="#285342">站队为何形成</text><text data-field="value" x="26" y="666" font-size="17px" fill="#26342e">杨修、丁仪等结党；机密泄露提</text><text data-field="value" x="26" y="694" font-size="17px" fill="#26342e">高政治成本</text><rect class="box" data-field="case-card" x="16" y="738" rx="8" width="288" height="316"/><text data-field="case" x="26" y="764" font-size="17px" fill="#285342">承乾与李泰</text><text data-field="dimension" x="26" y="800" font-size="17px" fill="#285342">名分状态</text><text data-field="value" x="26" y="832" font-size="17px" fill="#26342e">承乾已立，但泰月给越嫡、招士</text><text data-field="value" x="26" y="860" font-size="17px" fill="#26342e">获宠</text><text data-field="dimension" x="26" y="896" font-size="17px" fill="#285342">父亲的偏爱如何被看见</text><text data-field="value" x="26" y="928" font-size="17px" fill="#26342e">泰经营朝士，承乾反制并养刺客</text><text data-field="dimension" x="26" y="964" font-size="17px" fill="#285342">站队为何形成</text><text data-field="value" x="26" y="996" font-size="17px" fill="#26342e">名分、财用、门客和父亲摇摆共</text><text data-field="value" x="26" y="1024" font-size="17px" fill="#26342e">同制造逼迫感</text></svg>