<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 610" width="880" height="610"><title id="title">三案中的名分与资源变化</title><desc id="desc">时间线只表示事件先后；“促成风险”是本文分析，不表示单一事件充分造成后果。刘表案的继承决定记录在刘表死后；曹操案的建安二十二年正式立储与此前竞争分开；唐案把承乾已立、李泰获宠、承乾谋反和最终改立分列。[[s1]][[s4]][[s5]][[s7]][[s10]][[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><path class="line" d="M65 37V586"/><circle data-field="event" cx="65" cy="37" r="8" fill="#285342"/><text data-field="event-label" x="83" y="42" font-size="17px" fill="#285342">刘表病重至死 · 接触被阻断</text><text data-field="detail" x="83" y="73" font-size="16px" fill="#26342e">刘琦有江夏太守之职，却被蒯瑁、张允阻于父亲门外</text><circle data-field="event" cx="65" cy="133" r="8" fill="#285342"/><text data-field="event-label" x="83" y="138" font-size="17px" fill="#285342">刘表死后 · 刘琮被立为嗣</text><text data-field="detail" x="83" y="169" font-size="16px" fill="#26342e">记载归于瑁、允等，刘琦获得侯印后拒受</text><circle data-field="event" cx="65" cy="229" r="8" fill="#285342"/><text data-field="event-label" x="83" y="234" font-size="17px" fill="#285342">建安二十二年 · 曹丕正式立储</text><text data-field="detail" x="83" y="265" font-size="16px" fill="#26342e">此前有才名与嫡长之争，随后仍有曹植近臣网络</text><circle data-field="event" cx="65" cy="325" r="8" fill="#285342"/><text data-field="event-label" x="83" y="330" font-size="17px" fill="#285342">贞观十六年 · 李泰待遇越嫡</text><text data-field="detail" x="83" y="361" font-size="16px" fill="#26342e">《括地志》招士，月给超过太子，褚遂良要求定分</text><circle data-field="event" cx="65" cy="421" r="8" fill="#285342"/><text data-field="event-label" x="83" y="426" font-size="17px" fill="#285342">贞观十七年 · 两方组织化</text><text data-field="detail" x="83" y="457" font-size="16px" fill="#26342e">承乾谋杀泰，泰结交朝士；后来承基告变</text><circle data-field="event" cx="65" cy="517" r="8" fill="#285342"/><text data-field="event-label" x="83" y="522" font-size="17px" fill="#285342">同年后段 · 改立晋王治</text><text data-field="detail" x="83" y="553" font-size="16px" fill="#26342e">太宗拒绝以泰替承乾，改立治并使两废王获供给</text></svg>