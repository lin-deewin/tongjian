<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 886" width="320" height="886"><title id="title">三案中的名分与资源变化</title><desc id="desc">时间线只表示事件先后；“促成风险”是本文分析，不表示单一事件充分造成后果。刘表案的继承决定记录在刘表死后；曹操案的建安二十二年正式立储与此前竞争分开；唐案把承乾已立、李泰获宠、承乾谋反和最终改立分列。[[s1]][[s4]][[s5]][[s7]][[s10]][[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><path class="line" d="M51 37V862"/><circle data-field="event" cx="51" cy="37" r="8" fill="#285342"/><text data-field="event-label" x="69" y="42" font-size="17px" fill="#285342">刘表病重至死 · 接触被阻</text><text data-field="event-label" x="69" y="70" font-size="17px" fill="#285342">断</text><text data-field="detail" x="69" y="106" font-size="17px" fill="#26342e">刘琦有江夏太守之职，却被蒯</text><text data-field="detail" x="69" y="134" font-size="17px" fill="#26342e">瑁、张允阻于父亲门外</text><circle data-field="event" cx="51" cy="193" r="8" fill="#285342"/><text data-field="event-label" x="69" y="198" font-size="17px" fill="#285342">刘表死后 · 刘琮被立为嗣</text><text data-field="detail" x="69" y="234" font-size="17px" fill="#26342e">记载归于瑁、允等，刘琦获得</text><text data-field="detail" x="69" y="262" font-size="17px" fill="#26342e">侯印后拒受</text><circle data-field="event" cx="51" cy="321" r="8" fill="#285342"/><text data-field="event-label" x="69" y="326" font-size="17px" fill="#285342">建安二十二年 · 曹丕正式</text><text data-field="event-label" x="69" y="354" font-size="17px" fill="#285342">立储</text><text data-field="detail" x="69" y="390" font-size="17px" fill="#26342e">此前有才名与嫡长之争，随后</text><text data-field="detail" x="69" y="418" font-size="17px" fill="#26342e">仍有曹植近臣网络</text><circle data-field="event" cx="51" cy="477" r="8" fill="#285342"/><text data-field="event-label" x="69" y="482" font-size="17px" fill="#285342">贞观十六年 · 李泰待遇越</text><text data-field="event-label" x="69" y="510" font-size="17px" fill="#285342">嫡</text><text data-field="detail" x="69" y="546" font-size="17px" fill="#26342e">《括地志》招士，月给超过太</text><text data-field="detail" x="69" y="574" font-size="17px" fill="#26342e">子，褚遂良要求定分</text><circle data-field="event" cx="51" cy="633" r="8" fill="#285342"/><text data-field="event-label" x="69" y="638" font-size="17px" fill="#285342">贞观十七年 · 两方组织化</text><text data-field="detail" x="69" y="674" font-size="17px" fill="#26342e">承乾谋杀泰，泰结交朝士；后</text><text data-field="detail" x="69" y="702" font-size="17px" fill="#26342e">来承基告变</text><circle data-field="event" cx="51" cy="761" r="8" fill="#285342"/><text data-field="event-label" x="69" y="766" font-size="17px" fill="#285342">同年后段 · 改立晋王治</text><text data-field="detail" x="69" y="802" font-size="17px" fill="#26342e">太宗拒绝以泰替承乾，改立治</text><text data-field="detail" x="69" y="830" font-size="17px" fill="#26342e">并使两废王获供给</text></svg>