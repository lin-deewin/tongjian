<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 212" width="880" height="212"><title id="title">从认错到补救：四道需要分别核验的门</title><desc id="desc">分析示意。顺序帮助区分承认、停止伤害、调整条件与反馈恢复；它不把先后关系自动画成充分因果。汉武帝、孙权、德宗的材料分别落在不同门槛上，见 [[s1]] [[s4]] [[s8]] [[s12]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="191" height="164"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">承认责任</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">指出过去判断或做法造</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">成的具体问题</text><text data-field="link-note" x="40" y="162" font-size="13px" fill="#647069">责任说明为后续行动确定</text><text data-field="link-note" x="40" y="180" font-size="13px" fill="#647069">对象</text><rect class="box" data-field="card" x="239" y="24" rx="8" width="191" height="164"/><text data-field="label" x="249" y="51" font-size="17px" fill="#285342">停止伤害</text><text data-field="detail" x="249" y="82" font-size="16px" fill="#26342e">撤回命令、停止追加征</text><text data-field="detail" x="249" y="105" font-size="16px" fill="#26342e">发或惩罚</text><text data-field="link-note" x="249" y="162" font-size="13px" fill="#647069">撤回之后仍要改变执行环</text><text data-field="link-note" x="249" y="180" font-size="13px" fill="#647069">境</text><rect class="box" data-field="card" x="448" y="24" rx="8" width="191" height="164"/><text data-field="label" x="458" y="51" font-size="17px" fill="#285342">调整条件</text><text data-field="detail" x="458" y="82" font-size="16px" fill="#26342e">改变执行资源、程序与</text><text data-field="detail" x="458" y="105" font-size="16px" fill="#26342e">奖惩，使旧路难以复燃</text><text data-field="link-note" x="458" y="162" font-size="13px" fill="#647069">新的反馈检验承诺是否落</text><text data-field="link-note" x="458" y="180" font-size="13px" fill="#647069">地</text><rect class="box" data-field="card" x="657" y="24" rx="8" width="191" height="164"/><text data-field="label" x="667" y="51" font-size="17px" fill="#285342">恢复反馈</text><text data-field="detail" x="667" y="82" font-size="16px" fill="#26342e">让异议能到达，并检查</text><text data-field="detail" x="667" y="105" font-size="16px" fill="#26342e">新措施是否兑现</text><path class="line" d="M224 106H229"/><path d="m227 101 9 5-9 5z" fill="#285342"/><path class="line" d="M433 106H438"/><path d="m436 101 9 5-9 5z" fill="#285342"/><path class="line" d="M642 106H647"/><path d="m645 101 9 5-9 5z" fill="#285342"/></svg>