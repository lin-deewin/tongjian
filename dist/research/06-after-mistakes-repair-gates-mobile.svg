<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 754" width="320" height="754"><title id="title">从认错到补救：四道需要分别核验的门</title><desc id="desc">分析示意。顺序帮助区分承认、停止伤害、调整条件与反馈恢复；它不把先后关系自动画成充分因果。汉武帝、孙权、德宗的材料分别落在不同门槛上，见 [[s1]] [[s4]] [[s8]] [[s12]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="143"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">承认责任</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">指出过去判断或做法造成的具体问题</text><text data-field="link-note" x="26" y="153" font-size="17px" fill="#647069">责任说明为后续行动确定对象</text><rect class="box" data-field="card" x="16" y="201" rx="8" width="288" height="143"/><text data-field="label" x="26" y="228" font-size="17px" fill="#285342">停止伤害</text><text data-field="detail" x="26" y="264" font-size="17px" fill="#26342e">撤回命令、停止追加征发或惩罚</text><text data-field="link-note" x="26" y="330" font-size="17px" fill="#647069">撤回之后仍要改变执行环境</text><rect class="box" data-field="card" x="16" y="378" rx="8" width="288" height="171"/><text data-field="label" x="26" y="405" font-size="17px" fill="#285342">调整条件</text><text data-field="detail" x="26" y="441" font-size="17px" fill="#26342e">改变执行资源、程序与奖惩，使旧路</text><text data-field="detail" x="26" y="469" font-size="17px" fill="#26342e">难以复燃</text><text data-field="link-note" x="26" y="535" font-size="17px" fill="#647069">新的反馈检验承诺是否落地</text><rect class="box" data-field="card" x="16" y="583" rx="8" width="288" height="133"/><text data-field="label" x="26" y="610" font-size="17px" fill="#285342">恢复反馈</text><text data-field="detail" x="26" y="646" font-size="17px" fill="#26342e">让异议能到达，并检查新措施是否兑</text><text data-field="detail" x="26" y="674" font-size="17px" fill="#26342e">现</text><path class="line" d="M160 167V192"/><path d="m155 190 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 344V369"/><path d="m155 367 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 549V574"/><path d="m155 572 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>