<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 296" width="880" height="296"><title id="title">三种认错，各自修复了哪一层？</title><desc id="desc">定性比较，不是评分。表格把《通鉴》明确记载的动作与作者的解释并列；“未见充分证据”表示本文不替史料补写长期效果。见 [[s3]] [[s7]] [[s8]] [[s13]] [[s14]] [[s16]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">承认与触发</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">已见的停止或调整</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">仍需观察的反馈</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="68"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">轮台诏</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="68"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">追述远征失败、远田扰民与</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">判断失误</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="68"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">不复出军；转向休息、农政</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">与补足武备</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="68"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">不能扩大为全面弃战；后续</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">成效与政策范围需分开</text><rect class="box" data-field="cell" x="30" y="138" width="150" height="68"/><text data-field="cell" x="40" y="163" font-size="16px" fill="#26342e">吕壹案</text><rect class="box" data-field="cell" x="180" y="138" width="223" height="68"/><text data-field="cell" x="190" y="163" font-size="16px" fill="#26342e">具体冤案使孙权承认朱据被</text><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">枉、吏民可能更甚</text><rect class="box" data-field="cell" x="403" y="138" width="223" height="68"/><text data-field="cell" x="413" y="163" font-size="16px" fill="#26342e">吕壹伏诛，停止其继续排陷</text><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">；个案得免</text><rect class="box" data-field="cell" x="626" y="138" width="223" height="68"/><text data-field="cell" x="636" y="163" font-size="16px" fill="#26342e">孙权自责群臣不谏，但无充</text><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">分记载证明长期安全渠道</text><rect class="box" data-field="cell" x="30" y="206" width="150" height="68"/><text data-field="cell" x="40" y="231" font-size="16px" fill="#26342e">奉天罪己</text><rect class="box" data-field="cell" x="180" y="206" width="223" height="68"/><text data-field="cell" x="190" y="231" font-size="16px" fill="#26342e">陆贽诊断上下不通，德宗采</text><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">纳公开引过</text><rect class="box" data-field="cell" x="403" y="206" width="223" height="68"/><text data-field="cell" x="413" y="231" font-size="16px" fill="#26342e">停罢若干加征；对琼林大盈</text><text data-field="cell" x="413" y="254" font-size="16px" fill="#26342e">库批评作局部回应</text><rect class="box" data-field="cell" x="626" y="206" width="223" height="68"/><text data-field="cell" x="636" y="231" font-size="16px" fill="#26342e">萧复案显示疑心仍在；言事</text><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">是否相符要靠持续行动</text></svg>