<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1108" width="320" height="1108"><title id="title">三种认错，各自修复了哪一层？</title><desc id="desc">定性比较，不是评分。表格把《通鉴》明确记载的动作与作者的解释并列；“未见充分证据”表示本文不替史料补写长期效果。见 [[s3]] [[s7]] [[s8]] [[s13]] [[s14]] [[s16]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="344"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">轮台诏</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">承认与触发</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">追述远征失败、远田扰民与判断</text><text data-field="value" x="26" y="144" font-size="17px" fill="#26342e">失误</text><text data-field="dimension" x="26" y="180" font-size="17px" fill="#285342">已见的停止或调整</text><text data-field="value" x="26" y="212" font-size="17px" fill="#26342e">不复出军；转向休息、农政与补</text><text data-field="value" x="26" y="240" font-size="17px" fill="#26342e">足武备</text><text data-field="dimension" x="26" y="276" font-size="17px" fill="#285342">仍需观察的反馈</text><text data-field="value" x="26" y="308" font-size="17px" fill="#26342e">不能扩大为全面弃战；后续成效</text><text data-field="value" x="26" y="336" font-size="17px" fill="#26342e">与政策范围需分开</text><rect class="box" data-field="case-card" x="16" y="380" rx="8" width="288" height="344"/><text data-field="case" x="26" y="406" font-size="17px" fill="#285342">吕壹案</text><text data-field="dimension" x="26" y="442" font-size="17px" fill="#285342">承认与触发</text><text data-field="value" x="26" y="474" font-size="17px" fill="#26342e">具体冤案使孙权承认朱据被枉、</text><text data-field="value" x="26" y="502" font-size="17px" fill="#26342e">吏民可能更甚</text><text data-field="dimension" x="26" y="538" font-size="17px" fill="#285342">已见的停止或调整</text><text data-field="value" x="26" y="570" font-size="17px" fill="#26342e">吕壹伏诛，停止其继续排陷；个</text><text data-field="value" x="26" y="598" font-size="17px" fill="#26342e">案得免</text><text data-field="dimension" x="26" y="634" font-size="17px" fill="#285342">仍需观察的反馈</text><text data-field="value" x="26" y="666" font-size="17px" fill="#26342e">孙权自责群臣不谏，但无充分记</text><text data-field="value" x="26" y="694" font-size="17px" fill="#26342e">载证明长期安全渠道</text><rect class="box" data-field="case-card" x="16" y="738" rx="8" width="288" height="344"/><text data-field="case" x="26" y="764" font-size="17px" fill="#285342">奉天罪己</text><text data-field="dimension" x="26" y="800" font-size="17px" fill="#285342">承认与触发</text><text data-field="value" x="26" y="832" font-size="17px" fill="#26342e">陆贽诊断上下不通，德宗采纳公</text><text data-field="value" x="26" y="860" font-size="17px" fill="#26342e">开引过</text><text data-field="dimension" x="26" y="896" font-size="17px" fill="#285342">已见的停止或调整</text><text data-field="value" x="26" y="928" font-size="17px" fill="#26342e">停罢若干加征；对琼林大盈库批</text><text data-field="value" x="26" y="956" font-size="17px" fill="#26342e">评作局部回应</text><text data-field="dimension" x="26" y="992" font-size="17px" fill="#285342">仍需观察的反馈</text><text data-field="value" x="26" y="1024" font-size="17px" fill="#26342e">萧复案显示疑心仍在；言事是否</text><text data-field="value" x="26" y="1052" font-size="17px" fill="#26342e">相符要靠持续行动</text></svg>