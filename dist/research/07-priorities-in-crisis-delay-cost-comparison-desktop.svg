<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 364" width="880" height="364"><title id="title">推迟不同目标，会失去什么？</title><desc id="desc">定性比较只描述史料显示的风险结构，不给案例打分。括号内的“可能”标明作者分析；它不能替代当时决策者面对的不确定信息。[[s8]][[s15]][[s20]][[s21]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">先做的动作</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">若推迟另一目标</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">主要不可逆代价</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="68"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">官渡守壁待机</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="68"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">守住官渡壁垒</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="68"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">推迟决战</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="68"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">粮尽、逃亡、民心转移可能</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">先压垮防线</text><rect class="box" data-field="cell" x="30" y="138" width="150" height="68"/><text data-field="cell" x="40" y="163" font-size="16px" fill="#26342e">淝水抓渡河窗口</text><rect class="box" data-field="cell" x="180" y="138" width="223" height="68"/><text data-field="cell" x="190" y="163" font-size="16px" fill="#26342e">先在局部渡河</text><rect class="box" data-field="cell" x="403" y="138" width="223" height="68"/><text data-field="cell" x="413" y="163" font-size="16px" fill="#26342e">推迟全面会战</text><rect class="box" data-field="cell" x="626" y="138" width="223" height="68"/><text data-field="cell" x="636" y="163" font-size="16px" fill="#26342e">秦军可能合兵、粮道和前锋</text><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">更稳</text><rect class="box" data-field="cell" x="30" y="206" width="150" height="68"/><text data-field="cell" x="40" y="231" font-size="16px" fill="#26342e">先取范阳（未采用</text><text data-field="cell" x="40" y="254" font-size="16px" fill="#26342e">）</text><rect class="box" data-field="cell" x="180" y="206" width="223" height="68"/><text data-field="cell" x="190" y="231" font-size="16px" fill="#26342e">先摧毁叛军根本</text><rect class="box" data-field="cell" x="403" y="206" width="223" height="68"/><text data-field="cell" x="413" y="231" font-size="16px" fill="#26342e">推迟收复两京</text><rect class="box" data-field="cell" x="626" y="206" width="223" height="68"/><text data-field="cell" x="636" y="231" font-size="16px" fill="#26342e">朝廷威望、上皇关系和中原</text><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">秩序恢复更慢</text><rect class="box" data-field="cell" x="30" y="274" width="150" height="68"/><text data-field="cell" x="40" y="299" font-size="16px" fill="#26342e">肃宗先取两京（实</text><text data-field="cell" x="40" y="322" font-size="16px" fill="#26342e">际）</text><rect class="box" data-field="cell" x="180" y="274" width="223" height="68"/><text data-field="cell" x="190" y="299" font-size="16px" fill="#26342e">先收复两京</text><rect class="box" data-field="cell" x="403" y="274" width="223" height="68"/><text data-field="cell" x="413" y="299" font-size="16px" fill="#26342e">推迟摧毁范阳</text><rect class="box" data-field="cell" x="626" y="274" width="223" height="68"/><text data-field="cell" x="636" y="299" font-size="16px" fill="#26342e">叛军退河北，战争根部仍在</text></svg>