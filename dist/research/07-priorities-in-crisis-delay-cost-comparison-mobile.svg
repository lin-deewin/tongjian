<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1186" width="320" height="1186"><title id="title">推迟不同目标，会失去什么？</title><desc id="desc">定性比较只描述史料显示的风险结构，不给案例打分。括号内的“可能”标明作者分析；它不能替代当时决策者面对的不确定信息。[[s8]][[s15]][[s20]][[s21]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="288"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">官渡守壁待机</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">先做的动作</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">守住官渡壁垒</text><text data-field="dimension" x="26" y="152" font-size="17px" fill="#285342">若推迟另一目标</text><text data-field="value" x="26" y="184" font-size="17px" fill="#26342e">推迟决战</text><text data-field="dimension" x="26" y="220" font-size="17px" fill="#285342">主要不可逆代价</text><text data-field="value" x="26" y="252" font-size="17px" fill="#26342e">粮尽、逃亡、民心转移可能先压</text><text data-field="value" x="26" y="280" font-size="17px" fill="#26342e">垮防线</text><rect class="box" data-field="case-card" x="16" y="324" rx="8" width="288" height="260"/><text data-field="case" x="26" y="350" font-size="17px" fill="#285342">淝水抓渡河窗口</text><text data-field="dimension" x="26" y="386" font-size="17px" fill="#285342">先做的动作</text><text data-field="value" x="26" y="418" font-size="17px" fill="#26342e">先在局部渡河</text><text data-field="dimension" x="26" y="454" font-size="17px" fill="#285342">若推迟另一目标</text><text data-field="value" x="26" y="486" font-size="17px" fill="#26342e">推迟全面会战</text><text data-field="dimension" x="26" y="522" font-size="17px" fill="#285342">主要不可逆代价</text><text data-field="value" x="26" y="554" font-size="17px" fill="#26342e">秦军可能合兵、粮道和前锋更稳</text><rect class="box" data-field="case-card" x="16" y="598" rx="8" width="288" height="288"/><text data-field="case" x="26" y="624" font-size="17px" fill="#285342">先取范阳（未采用）</text><text data-field="dimension" x="26" y="660" font-size="17px" fill="#285342">先做的动作</text><text data-field="value" x="26" y="692" font-size="17px" fill="#26342e">先摧毁叛军根本</text><text data-field="dimension" x="26" y="728" font-size="17px" fill="#285342">若推迟另一目标</text><text data-field="value" x="26" y="760" font-size="17px" fill="#26342e">推迟收复两京</text><text data-field="dimension" x="26" y="796" font-size="17px" fill="#285342">主要不可逆代价</text><text data-field="value" x="26" y="828" font-size="17px" fill="#26342e">朝廷威望、上皇关系和中原秩序</text><text data-field="value" x="26" y="856" font-size="17px" fill="#26342e">恢复更慢</text><rect class="box" data-field="case-card" x="16" y="900" rx="8" width="288" height="260"/><text data-field="case" x="26" y="926" font-size="17px" fill="#285342">肃宗先取两京（实际）</text><text data-field="dimension" x="26" y="962" font-size="17px" fill="#285342">先做的动作</text><text data-field="value" x="26" y="994" font-size="17px" fill="#26342e">先收复两京</text><text data-field="dimension" x="26" y="1030" font-size="17px" fill="#285342">若推迟另一目标</text><text data-field="value" x="26" y="1062" font-size="17px" fill="#26342e">推迟摧毁范阳</text><text data-field="dimension" x="26" y="1098" font-size="17px" fill="#285342">主要不可逆代价</text><text data-field="value" x="26" y="1130" font-size="17px" fill="#26342e">叛军退河北，战争根部仍在</text></svg>