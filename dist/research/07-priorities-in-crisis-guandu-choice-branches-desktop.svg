<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 312" width="880" height="312"><title id="title">官渡相持中的选择分叉（分析示意）</title><desc id="desc">这是根据曹操与荀彧、袁绍与沮授等记载重建的可行选择，不表示史料列出了这张决策树。箭头不代表必然因果：各条路都依赖粮道、军心和对手反应。[[s6]][[s7]][[s8]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><text data-field="prompt" x="30" y="24" font-size="17px" fill="#285342">粮少、兵少而对手仍有储备时，先做什么？</text><rect class="box" data-field="branch" x="30" y="65" rx="8" width="264" height="233"/><text data-field="option" x="40" y="92" font-size="17px" fill="#285342">退回许都</text><text data-field="field-label" x="40" y="121" font-size="14px" fill="#285342">成立条件：</text><text data-field="field-value" x="40" y="144" font-size="16px" fill="#26342e">保留主力，放弃官渡前沿</text><text data-field="field-label" x="40" y="172" font-size="14px" fill="#285342">代价：</text><text data-field="field-value" x="40" y="195" font-size="16px" fill="#26342e">把主动权和屏障交给袁绍</text><text data-field="field-label" x="40" y="223" font-size="14px" fill="#285342">限度：</text><text data-field="field-value" x="40" y="246" font-size="16px" fill="#26342e">不能保证许都不会被追击</text><rect class="box" data-field="branch" x="308" y="65" rx="8" width="264" height="233"/><text data-field="option" x="318" y="92" font-size="17px" fill="#285342">守住官渡</text><text data-field="field-label" x="318" y="121" font-size="14px" fill="#285342">成立条件：</text><text data-field="field-value" x="318" y="144" font-size="16px" fill="#26342e">壁垒尚能阻挡推进，仍有等待空间</text><text data-field="field-label" x="318" y="172" font-size="14px" fill="#285342">代价：</text><text data-field="field-value" x="318" y="195" font-size="16px" fill="#26342e">承受粮尽、逃亡与内部压力</text><text data-field="field-label" x="318" y="223" font-size="14px" fill="#285342">限度：</text><text data-field="field-value" x="318" y="246" font-size="16px" fill="#26342e">不能保证援粮及时到达</text><rect class="box" data-field="branch" x="586" y="65" rx="8" width="264" height="233"/><text data-field="option" x="596" y="92" font-size="17px" fill="#285342">主动决战</text><text data-field="field-label" x="596" y="121" font-size="14px" fill="#285342">成立条件：</text><text data-field="field-value" x="596" y="144" font-size="16px" fill="#26342e">发现对手阵形或补给暴露破绽</text><text data-field="field-label" x="596" y="172" font-size="14px" fill="#285342">代价：</text><text data-field="field-value" x="596" y="195" font-size="16px" fill="#26342e">失败后难以恢复防线</text><text data-field="field-label" x="596" y="223" font-size="14px" fill="#285342">限度：</text><text data-field="field-value" x="596" y="246" font-size="16px" fill="#26342e">不能把数量劣势变成数量优势</text></svg>