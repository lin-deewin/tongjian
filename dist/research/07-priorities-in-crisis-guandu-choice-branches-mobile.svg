<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 964" width="320" height="964"><title id="title">官渡相持中的选择分叉（分析示意）</title><desc id="desc">这是根据曹操与荀彧、袁绍与沮授等记载重建的可行选择，不表示史料列出了这张决策树。箭头不代表必然因果：各条路都依赖粮道、军心和对手反应。[[s6]][[s7]][[s8]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><text data-field="prompt" x="16" y="24" font-size="17px" fill="#285342">粮少、兵少而对手仍有储备时，先做</text><text data-field="prompt" x="16" y="52" font-size="17px" fill="#285342">什么？</text><rect class="box" data-field="branch" x="16" y="98" rx="8" width="288" height="268"/><text data-field="option" x="26" y="125" font-size="17px" fill="#285342">退回许都</text><text data-field="field-label" x="26" y="159" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="187" font-size="17px" fill="#26342e">保留主力，放弃官渡前沿</text><text data-field="field-label" x="26" y="220" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="248" font-size="17px" fill="#26342e">把主动权和屏障交给袁绍</text><text data-field="field-label" x="26" y="281" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="309" font-size="17px" fill="#26342e">不能保证许都不会被追击</text><rect class="box" data-field="branch" x="16" y="382" rx="8" width="288" height="268"/><text data-field="option" x="26" y="409" font-size="17px" fill="#285342">守住官渡</text><text data-field="field-label" x="26" y="443" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="471" font-size="17px" fill="#26342e">壁垒尚能阻挡推进，仍有等待空间</text><text data-field="field-label" x="26" y="504" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="532" font-size="17px" fill="#26342e">承受粮尽、逃亡与内部压力</text><text data-field="field-label" x="26" y="565" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="593" font-size="17px" fill="#26342e">不能保证援粮及时到达</text><rect class="box" data-field="branch" x="16" y="666" rx="8" width="288" height="268"/><text data-field="option" x="26" y="693" font-size="17px" fill="#285342">主动决战</text><text data-field="field-label" x="26" y="727" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="755" font-size="17px" fill="#26342e">发现对手阵形或补给暴露破绽</text><text data-field="field-label" x="26" y="788" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="816" font-size="17px" fill="#26342e">失败后难以恢复防线</text><text data-field="field-label" x="26" y="849" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="877" font-size="17px" fill="#26342e">不能把数量劣势变成数量优势</text></svg>