<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 418" width="880" height="418"><title id="title">李泌方案与实际行动的分叉</title><desc id="desc">时间线把李泌提出的方案、肃宗的即时取舍和后来战果分开；方案本身不等于执行，后来的收复也不能反证原方案必然成功。日期按《通鉴》编年；“春气已深”等为史料中的季节判断。[[s19]][[s20]][[s21]][[s29]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><path class="line" d="M65 37V394"/><circle data-field="event" cx="65" cy="37" r="8" fill="#285342"/><text data-field="event-label" x="83" y="42" font-size="17px" fill="#285342">至德元载 · 先取范阳的方案</text><text data-field="detail" x="83" y="73" font-size="16px" fill="#26342e">以牵制和北方机动兵力摧毁叛军巢穴</text><circle data-field="event" cx="65" cy="133" r="8" fill="#285342"/><text data-field="event-label" x="83" y="138" font-size="17px" fill="#285342">至德二载春 · 肃宗选择先取两京</text><text data-field="detail" x="83" y="169" font-size="16px" fill="#26342e">因晨昏之恋与政治需要，不能等待北上</text><circle data-field="event" cx="65" cy="229" r="8" fill="#285342"/><text data-field="event-label" x="83" y="234" font-size="17px" fill="#285342">至德二载秋 · 东京捷奏，入西京</text><text data-field="detail" x="83" y="265" font-size="16px" fill="#26342e">卷载东京捷奏后，肃宗进入西京</text><circle data-field="event" cx="65" cy="325" r="8" fill="#285342"/><text data-field="event-label" x="83" y="330" font-size="17px" fill="#285342">其后 · 叛乱并未立即终止</text><text data-field="detail" x="83" y="361" font-size="16px" fill="#26342e">安庆绪退河北，史思明等势力仍存</text></svg>