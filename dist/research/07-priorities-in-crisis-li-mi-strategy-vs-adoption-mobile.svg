<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 630" width="320" height="630"><title id="title">李泌方案与实际行动的分叉</title><desc id="desc">时间线把李泌提出的方案、肃宗的即时取舍和后来战果分开；方案本身不等于执行，后来的收复也不能反证原方案必然成功。日期按《通鉴》编年；“春气已深”等为史料中的季节判断。[[s19]][[s20]][[s21]][[s29]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><path class="line" d="M51 37V606"/><circle data-field="event" cx="51" cy="37" r="8" fill="#285342"/><text data-field="event-label" x="69" y="42" font-size="17px" fill="#285342">至德元载 · 先取范阳的方</text><text data-field="event-label" x="69" y="70" font-size="17px" fill="#285342">案</text><text data-field="detail" x="69" y="106" font-size="17px" fill="#26342e">以牵制和北方机动兵力摧毁叛</text><text data-field="detail" x="69" y="134" font-size="17px" fill="#26342e">军巢穴</text><circle data-field="event" cx="51" cy="193" r="8" fill="#285342"/><text data-field="event-label" x="69" y="198" font-size="17px" fill="#285342">至德二载春 · 肃宗选择先</text><text data-field="event-label" x="69" y="226" font-size="17px" fill="#285342">取两京</text><text data-field="detail" x="69" y="262" font-size="17px" fill="#26342e">因晨昏之恋与政治需要，不能</text><text data-field="detail" x="69" y="290" font-size="17px" fill="#26342e">等待北上</text><circle data-field="event" cx="51" cy="349" r="8" fill="#285342"/><text data-field="event-label" x="69" y="354" font-size="17px" fill="#285342">至德二载秋 · 东京捷奏，</text><text data-field="event-label" x="69" y="382" font-size="17px" fill="#285342">入西京</text><text data-field="detail" x="69" y="418" font-size="17px" fill="#26342e">卷载东京捷奏后，肃宗进入西</text><text data-field="detail" x="69" y="446" font-size="17px" fill="#26342e">京</text><circle data-field="event" cx="51" cy="505" r="8" fill="#285342"/><text data-field="event-label" x="69" y="510" font-size="17px" fill="#285342">其后 · 叛乱并未立即终止</text><text data-field="detail" x="69" y="546" font-size="17px" fill="#26342e">安庆绪退河北，史思明等势力</text><text data-field="detail" x="69" y="574" font-size="17px" fill="#26342e">仍存</text></svg>