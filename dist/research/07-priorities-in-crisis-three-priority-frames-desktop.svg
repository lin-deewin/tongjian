<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 290" width="880" height="290"><title id="title">三场危机首先要保住的约束</title><desc id="desc">这是对史料中行动与争论的分析性归纳，不是当事人使用的量表。表中“先保”表示若该项失守，后续选择空间会显著缩小；“推迟”表示目标重要但可暂不立即完成。顺序和因果仍须结合正文核读。[[s1]][[s2]][[s3]][[s4]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="335" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">先保住什么</text><rect class="box" data-field="header" x="515" y="22" width="335" height="48"/><text data-field="header" x="525" y="47" font-size="17px" fill="#285342">可以推迟什么</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="66"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">官渡</text><rect class="box" data-field="cell" x="180" y="70" width="335" height="66"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">曹军的粮道、壁垒与等待时间</text><rect class="box" data-field="cell" x="515" y="70" width="335" height="66"/><text data-field="cell" x="525" y="95" font-size="16px" fill="#26342e">立即决战，或追求一次性歼灭</text><rect class="box" data-field="cell" x="30" y="136" width="150" height="66"/><text data-field="cell" x="40" y="161" font-size="16px" fill="#26342e">淝水</text><rect class="box" data-field="cell" x="180" y="136" width="335" height="66"/><text data-field="cell" x="190" y="161" font-size="16px" fill="#26342e">可控的渡河时机与军队秩序</text><rect class="box" data-field="cell" x="515" y="136" width="335" height="66"/><text data-field="cell" x="525" y="161" font-size="16px" fill="#26342e">等待秦军合兵后再寻机渡河</text><rect class="box" data-field="cell" x="30" y="202" width="150" height="66"/><text data-field="cell" x="40" y="227" font-size="16px" fill="#26342e">李泌方案</text><rect class="box" data-field="cell" x="180" y="202" width="335" height="66"/><text data-field="cell" x="190" y="227" font-size="16px" fill="#26342e">攻取范阳的战略窗口与西北军季节条件</text><rect class="box" data-field="cell" x="515" y="202" width="335" height="66"/><text data-field="cell" x="525" y="227" font-size="16px" fill="#26342e">先收两京、满足晨昏之恋</text></svg>