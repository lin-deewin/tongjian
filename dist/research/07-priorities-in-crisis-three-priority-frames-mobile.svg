<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 680" width="320" height="680"><title id="title">三场危机首先要保住的约束</title><desc id="desc">这是对史料中行动与争论的分析性归纳，不是当事人使用的量表。表中“先保”表示若该项失守，后续选择空间会显著缩小；“推迟”表示目标重要但可暂不立即完成。顺序和因果仍须结合正文核读。[[s1]][[s2]][[s3]][[s4]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="192"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">官渡</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">先保住什么</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">曹军的粮道、壁垒与等待时间</text><text data-field="dimension" x="26" y="152" font-size="17px" fill="#285342">可以推迟什么</text><text data-field="value" x="26" y="184" font-size="17px" fill="#26342e">立即决战，或追求一次性歼灭</text><rect class="box" data-field="case-card" x="16" y="228" rx="8" width="288" height="192"/><text data-field="case" x="26" y="254" font-size="17px" fill="#285342">淝水</text><text data-field="dimension" x="26" y="290" font-size="17px" fill="#285342">先保住什么</text><text data-field="value" x="26" y="322" font-size="17px" fill="#26342e">可控的渡河时机与军队秩序</text><text data-field="dimension" x="26" y="358" font-size="17px" fill="#285342">可以推迟什么</text><text data-field="value" x="26" y="390" font-size="17px" fill="#26342e">等待秦军合兵后再寻机渡河</text><rect class="box" data-field="case-card" x="16" y="434" rx="8" width="288" height="220"/><text data-field="case" x="26" y="460" font-size="17px" fill="#285342">李泌方案</text><text data-field="dimension" x="26" y="496" font-size="17px" fill="#285342">先保住什么</text><text data-field="value" x="26" y="528" font-size="17px" fill="#26342e">攻取范阳的战略窗口与西北军季</text><text data-field="value" x="26" y="556" font-size="17px" fill="#26342e">节条件</text><text data-field="dimension" x="26" y="592" font-size="17px" fill="#285342">可以推迟什么</text><text data-field="value" x="26" y="624" font-size="17px" fill="#26342e">先收两京、满足晨昏之恋</text></svg>