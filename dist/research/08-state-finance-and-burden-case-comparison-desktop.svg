<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 296" width="880" height="296"><title id="title">三案比较：收入手段不同，负担转移的位置也不同</title><desc id="desc">表格是定性比较。汉武帝的六百万石、五百万匹等数字只属于[[s6]]所载条目；隋仁寿宫与伐高丽的伤亡按原文范围表述；唐两税的目标和后续加征分别见[[s9]][[s15]][[s16]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">资源进入国家的方式</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">最先被看见的承担者</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">最容易被遮蔽的成本</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="68"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">汉武帝</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="68"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">盐铁专卖、算缗告缗、均输</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">平准</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="68"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">商人、末作和被征供给的郡</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">县</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="68"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">举报误伤、运输与地方供办</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">；收益与成本跨地域</text><rect class="box" data-field="cell" x="30" y="138" width="150" height="68"/><text data-field="cell" x="40" y="163" font-size="16px" fill="#26342e">隋文帝</text><rect class="box" data-field="cell" x="180" y="138" width="223" height="68"/><text data-field="cell" x="190" y="163" font-size="16px" fill="#26342e">轻赋积储后转为工程与远征</text><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">动员</text><rect class="box" data-field="cell" x="403" y="138" width="223" height="68"/><text data-field="cell" x="413" y="163" font-size="16px" fill="#26342e">仁寿宫丁夫、军士及粮道民</text><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">户</text><rect class="box" data-field="cell" x="626" y="138" width="223" height="68"/><text data-field="cell" x="636" y="163" font-size="16px" fill="#26342e">死亡、疾病、馈运中断；宏</text><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">大工程的政治收益</text><rect class="box" data-field="cell" x="30" y="206" width="150" height="68"/><text data-field="cell" x="40" y="231" font-size="16px" fill="#26342e">唐德宗</text><rect class="box" data-field="cell" x="180" y="206" width="223" height="68"/><text data-field="cell" x="190" y="231" font-size="16px" fill="#26342e">按户产定额，秋夏两征，归</text><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">并旧科目</text><rect class="box" data-field="cell" x="403" y="206" width="223" height="68"/><text data-field="cell" x="413" y="231" font-size="16px" fill="#26342e">固定居产者与地方纳税户</text><rect class="box" data-field="cell" x="626" y="206" width="223" height="68"/><text data-field="cell" x="636" y="231" font-size="16px" fill="#26342e">两税外诛求、强籴、军费和</text><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">转运损耗</text></svg>