<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 968" width="320" height="968"><title id="title">三案比较：收入手段不同，负担转移的位置也不同</title><desc id="desc">表格是定性比较。汉武帝的六百万石、五百万匹等数字只属于[[s6]]所载条目；隋仁寿宫与伐高丽的伤亡按原文范围表述；唐两税的目标和后续加征分别见[[s9]][[s15]][[s16]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="288"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">汉武帝</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">资源进入国家的方式</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">盐铁专卖、算缗告缗、均输平准</text><text data-field="dimension" x="26" y="152" font-size="17px" fill="#285342">最先被看见的承担者</text><text data-field="value" x="26" y="184" font-size="17px" fill="#26342e">商人、末作和被征供给的郡县</text><text data-field="dimension" x="26" y="220" font-size="17px" fill="#285342">最容易被遮蔽的成本</text><text data-field="value" x="26" y="252" font-size="17px" fill="#26342e">举报误伤、运输与地方供办；收</text><text data-field="value" x="26" y="280" font-size="17px" fill="#26342e">益与成本跨地域</text><rect class="box" data-field="case-card" x="16" y="324" rx="8" width="288" height="288"/><text data-field="case" x="26" y="350" font-size="17px" fill="#285342">隋文帝</text><text data-field="dimension" x="26" y="386" font-size="17px" fill="#285342">资源进入国家的方式</text><text data-field="value" x="26" y="418" font-size="17px" fill="#26342e">轻赋积储后转为工程与远征动员</text><text data-field="dimension" x="26" y="454" font-size="17px" fill="#285342">最先被看见的承担者</text><text data-field="value" x="26" y="486" font-size="17px" fill="#26342e">仁寿宫丁夫、军士及粮道民户</text><text data-field="dimension" x="26" y="522" font-size="17px" fill="#285342">最容易被遮蔽的成本</text><text data-field="value" x="26" y="554" font-size="17px" fill="#26342e">死亡、疾病、馈运中断；宏大工</text><text data-field="value" x="26" y="582" font-size="17px" fill="#26342e">程的政治收益</text><rect class="box" data-field="case-card" x="16" y="626" rx="8" width="288" height="316"/><text data-field="case" x="26" y="652" font-size="17px" fill="#285342">唐德宗</text><text data-field="dimension" x="26" y="688" font-size="17px" fill="#285342">资源进入国家的方式</text><text data-field="value" x="26" y="720" font-size="17px" fill="#26342e">按户产定额，秋夏两征，归并旧</text><text data-field="value" x="26" y="748" font-size="17px" fill="#26342e">科目</text><text data-field="dimension" x="26" y="784" font-size="17px" fill="#285342">最先被看见的承担者</text><text data-field="value" x="26" y="816" font-size="17px" fill="#26342e">固定居产者与地方纳税户</text><text data-field="dimension" x="26" y="852" font-size="17px" fill="#285342">最容易被遮蔽的成本</text><text data-field="value" x="26" y="884" font-size="17px" fill="#26342e">两税外诛求、强籴、军费和转运</text><text data-field="value" x="26" y="912" font-size="17px" fill="#26342e">损耗</text></svg>