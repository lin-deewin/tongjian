<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 189" width="880" height="189"><title id="title">资源进入国家系统的三条路径（分析示意）</title><desc id="desc">读图时从左向右看：国家把资源集中起来的方式不同，承担成本的人也不同。箭头表示制度或行政上的传递关系，不表示后果由单一环节造成。汉武帝的均输数字见[[s6]]；隋的劳役与军粮压力见[[s12]][[s14]]；唐两税的设计与执行问题见[[s9]][[s15]][[s16]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="191" height="141"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">先找资源</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">汉：商货与盐铁；隋：</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">丁夫、粮与储积；唐：</text><text data-field="detail" x="40" y="128" font-size="16px" fill="#26342e">户产与两季税</text><rect class="box" data-field="card" x="239" y="24" rx="8" width="191" height="141"/><text data-field="label" x="249" y="51" font-size="17px" fill="#285342">集中方式</text><text data-field="detail" x="249" y="82" font-size="16px" fill="#26342e">专卖、均输和告缗；工</text><text data-field="detail" x="249" y="105" font-size="16px" fill="#26342e">程征发；按资产定额征</text><text data-field="detail" x="249" y="128" font-size="16px" fill="#26342e">税</text><rect class="box" data-field="card" x="448" y="24" rx="8" width="191" height="141"/><text data-field="label" x="458" y="51" font-size="17px" fill="#285342">传递损耗</text><text data-field="detail" x="458" y="82" font-size="16px" fill="#26342e">官府收购与转运；劳役</text><text data-field="detail" x="458" y="105" font-size="16px" fill="#26342e">死亡、军粮中断；地方</text><text data-field="detail" x="458" y="128" font-size="16px" fill="#26342e">加征与强籴</text><rect class="box" data-field="card" x="657" y="24" rx="8" width="191" height="141"/><text data-field="label" x="667" y="51" font-size="17px" fill="#285342">谁承担</text><text data-field="detail" x="667" y="82" font-size="16px" fill="#26342e">商人和隐匿财产者；被</text><text data-field="detail" x="667" y="105" font-size="16px" fill="#26342e">征丁夫与沿途民户；固</text><text data-field="detail" x="667" y="128" font-size="16px" fill="#26342e">定居产者与纳税户</text><path class="line" d="M224 94H229"/><path d="m227 89 9 5-9 5z" fill="#285342"/><path class="line" d="M433 94H438"/><path d="m436 89 9 5-9 5z" fill="#285342"/><path class="line" d="M642 94H647"/><path d="m645 89 9 5-9 5z" fill="#285342"/></svg>