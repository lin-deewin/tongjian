<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 696" width="320" height="696"><title id="title">资源进入国家系统的三条路径（分析示意）</title><desc id="desc">读图时从左向右看：国家把资源集中起来的方式不同，承担成本的人也不同。箭头表示制度或行政上的传递关系，不表示后果由单一环节造成。汉武帝的均输数字见[[s6]]；隋的劳役与军粮压力见[[s12]][[s14]]；唐两税的设计与执行问题见[[s9]][[s15]][[s16]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="133"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">先找资源</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">汉：商货与盐铁；隋：丁夫、粮与储</text><text data-field="detail" x="26" y="115" font-size="17px" fill="#26342e">积；唐：户产与两季税</text><rect class="box" data-field="card" x="16" y="191" rx="8" width="288" height="133"/><text data-field="label" x="26" y="218" font-size="17px" fill="#285342">集中方式</text><text data-field="detail" x="26" y="254" font-size="17px" fill="#26342e">专卖、均输和告缗；工程征发；按资</text><text data-field="detail" x="26" y="282" font-size="17px" fill="#26342e">产定额征税</text><rect class="box" data-field="card" x="16" y="358" rx="8" width="288" height="133"/><text data-field="label" x="26" y="385" font-size="17px" fill="#285342">传递损耗</text><text data-field="detail" x="26" y="421" font-size="17px" fill="#26342e">官府收购与转运；劳役死亡、军粮中</text><text data-field="detail" x="26" y="449" font-size="17px" fill="#26342e">断；地方加征与强籴</text><rect class="box" data-field="card" x="16" y="525" rx="8" width="288" height="133"/><text data-field="label" x="26" y="552" font-size="17px" fill="#285342">谁承担</text><text data-field="detail" x="26" y="588" font-size="17px" fill="#26342e">商人和隐匿财产者；被征丁夫与沿途</text><text data-field="detail" x="26" y="616" font-size="17px" fill="#26342e">民户；固定居产者与纳税户</text><path class="line" d="M160 157V182"/><path d="m155 180 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 324V349"/><path d="m155 347 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 491V516"/><path d="m155 514 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>