<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1048" width="320" height="1048"><title id="title">同一项国家工程，成本在哪个节点变得不可见？</title><desc id="desc">这是作者根据仁寿宫与隋军粮记载重建的分析决策树，不是隋廷实际列出的选项。它用来区分财政账面上的“能不能付”与人力、时间、死亡和转运的实际承受能力。依据[[s12]][[s13]][[s14]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><text data-field="prompt" x="16" y="24" font-size="17px" fill="#285342">国家已有仓储和行政动员能力，要为</text><text data-field="prompt" x="16" y="52" font-size="17px" fill="#285342">宫室或远征筹集资源，首先该看什么</text><text data-field="prompt" x="16" y="80" font-size="17px" fill="#285342">？</text><rect class="box" data-field="branch" x="16" y="126" rx="8" width="288" height="296"/><text data-field="option" x="26" y="153" font-size="17px" fill="#285342">只看库藏</text><text data-field="field-label" x="26" y="187" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="215" font-size="17px" fill="#26342e">账面粮帛足，征发命令能下达</text><text data-field="field-label" x="26" y="248" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="276" font-size="17px" fill="#26342e">工程与转运中的死亡、逃亡不易进入</text><text data-field="field-value" x="26" y="304" font-size="17px" fill="#26342e">国库账</text><text data-field="field-label" x="26" y="337" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="365" font-size="17px" fill="#26342e">不能说明民间还能否继续生产和服役</text><rect class="box" data-field="branch" x="16" y="438" rx="8" width="288" height="268"/><text data-field="option" x="26" y="465" font-size="17px" fill="#285342">把人力计入</text><text data-field="field-label" x="26" y="499" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="527" font-size="17px" fill="#26342e">掌握工期、路程、疾病和替代劳力</text><text data-field="field-label" x="26" y="560" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="588" font-size="17px" fill="#26342e">可能放慢工程或减少远征规模</text><text data-field="field-label" x="26" y="621" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="649" font-size="17px" fill="#26342e">也不能保证地方官如实上报</text><rect class="box" data-field="branch" x="16" y="722" rx="8" width="288" height="296"/><text data-field="option" x="26" y="749" font-size="17px" fill="#285342">先缩短链条</text><text data-field="field-label" x="26" y="783" font-size="17px" fill="#285342">成立条件：</text><text data-field="field-value" x="26" y="811" font-size="17px" fill="#26342e">可就地取材、就地储粮，减少远距离</text><text data-field="field-value" x="26" y="839" font-size="17px" fill="#26342e">转运</text><text data-field="field-label" x="26" y="872" font-size="17px" fill="#285342">代价：</text><text data-field="field-value" x="26" y="900" font-size="17px" fill="#26342e">牺牲宫室规模或军事目标的速度</text><text data-field="field-label" x="26" y="933" font-size="17px" fill="#285342">限度：</text><text data-field="field-value" x="26" y="961" font-size="17px" fill="#26342e">边疆与灾年仍可能迫使国家远调资源</text></svg>