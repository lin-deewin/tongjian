<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 235" width="880" height="235"><title id="title">安身条件如何逐步变化：从寄食到地方秩序</title><desc id="desc">这是根据《通鉴》相关记载整理的分析示意。箭头表示条件可能相互影响，不表示每一步必然导致下一步；李特初期的救护与后来赵廞借赈济收众、再到刘弘给田给种粮，是不同阶段和不同人物的材料，不能拼成一条单一历史路径。[[s1]] [[s3]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="149" height="187"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">道路求生</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">疾病、饥饿与掠夺</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">使人群需要即时救</text><text data-field="detail" x="40" y="128" font-size="16px" fill="#26342e">护</text><text data-field="link-note" x="40" y="185" font-size="13px" fill="#647069">粮食不足会放大保</text><text data-field="link-note" x="40" y="203" font-size="13px" fill="#647069">护需求</text><rect class="box" data-field="card" x="197" y="24" rx="8" width="149" height="187"/><text data-field="label" x="207" y="51" font-size="17px" fill="#285342">获得寄食</text><text data-field="detail" x="207" y="82" font-size="16px" fill="#26342e">仓储与收成决定地</text><text data-field="detail" x="207" y="105" font-size="16px" fill="#26342e">方能否暂时承受外</text><text data-field="detail" x="207" y="128" font-size="16px" fill="#26342e">来人口</text><text data-field="link-note" x="207" y="185" font-size="13px" fill="#647069">保护关系决定能否</text><text data-field="link-note" x="207" y="203" font-size="13px" fill="#647069">留在粮食来源附近</text><rect class="box" data-field="card" x="364" y="24" rx="8" width="149" height="187"/><text data-field="label" x="374" y="51" font-size="17px" fill="#285342">寻求保护</text><text data-field="detail" x="374" y="82" font-size="16px" fill="#26342e">首领、坞壁或官军</text><text data-field="detail" x="374" y="105" font-size="16px" fill="#26342e">提供抵抗风险的组</text><text data-field="detail" x="374" y="128" font-size="16px" fill="#26342e">织</text><text data-field="link-note" x="374" y="185" font-size="13px" fill="#647069">生计与身份使组织</text><text data-field="link-note" x="374" y="203" font-size="13px" fill="#647069">获得持续资源</text><rect class="box" data-field="card" x="531" y="24" rx="8" width="149" height="187"/><text data-field="label" x="541" y="51" font-size="17px" fill="#285342">形成生计</text><text data-field="detail" x="541" y="82" font-size="16px" fill="#26342e">田地、种粮与身份</text><text data-field="detail" x="541" y="105" font-size="16px" fill="#26342e">安排使停留可以延</text><text data-field="detail" x="541" y="128" font-size="16px" fill="#26342e">续</text><text data-field="link-note" x="541" y="185" font-size="13px" fill="#647069">新冲突会改变原有</text><text data-field="link-note" x="541" y="203" font-size="13px" fill="#647069">安身条件</text><rect class="box" data-field="card" x="698" y="24" rx="8" width="149" height="187"/><text data-field="label" x="708" y="51" font-size="17px" fill="#285342">重新谈判</text><text data-field="detail" x="708" y="82" font-size="16px" fill="#26342e">接纳者的猜疑、征</text><text data-field="detail" x="708" y="105" font-size="16px" fill="#26342e">发或承诺落空会再</text><text data-field="detail" x="708" y="128" font-size="16px" fill="#26342e">次推动迁移</text><path class="line" d="M182 117H187"/><path d="m185 112 9 5-9 5z" fill="#285342"/><path class="line" d="M349 117H354"/><path d="m352 112 9 5-9 5z" fill="#285342"/><path class="line" d="M516 117H521"/><path d="m519 112 9 5-9 5z" fill="#285342"/><path class="line" d="M683 117H688"/><path d="m686 112 9 5-9 5z" fill="#285342"/></svg>