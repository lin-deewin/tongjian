<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1043" width="320" height="1043"><title id="title">安身条件如何逐步变化：从寄食到地方秩序</title><desc id="desc">这是根据《通鉴》相关记载整理的分析示意。箭头表示条件可能相互影响，不表示每一步必然导致下一步；李特初期的救护与后来赵廞借赈济收众、再到刘弘给田给种粮，是不同阶段和不同人物的材料，不能拼成一条单一历史路径。[[s1]] [[s3]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="171"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">道路求生</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">疾病、饥饿与掠夺使人群需要即时救</text><text data-field="detail" x="26" y="115" font-size="17px" fill="#26342e">护</text><text data-field="link-note" x="26" y="181" font-size="17px" fill="#647069">粮食不足会放大保护需求</text><rect class="box" data-field="card" x="16" y="229" rx="8" width="288" height="199"/><text data-field="label" x="26" y="256" font-size="17px" fill="#285342">获得寄食</text><text data-field="detail" x="26" y="292" font-size="17px" fill="#26342e">仓储与收成决定地方能否暂时承受外</text><text data-field="detail" x="26" y="320" font-size="17px" fill="#26342e">来人口</text><text data-field="link-note" x="26" y="386" font-size="17px" fill="#647069">保护关系决定能否留在粮食来源</text><text data-field="link-note" x="26" y="414" font-size="17px" fill="#647069">附近</text><rect class="box" data-field="card" x="16" y="462" rx="8" width="288" height="171"/><text data-field="label" x="26" y="489" font-size="17px" fill="#285342">寻求保护</text><text data-field="detail" x="26" y="525" font-size="17px" fill="#26342e">首领、坞壁或官军提供抵抗风险的组</text><text data-field="detail" x="26" y="553" font-size="17px" fill="#26342e">织</text><text data-field="link-note" x="26" y="619" font-size="17px" fill="#647069">生计与身份使组织获得持续资源</text><rect class="box" data-field="card" x="16" y="667" rx="8" width="288" height="171"/><text data-field="label" x="26" y="694" font-size="17px" fill="#285342">形成生计</text><text data-field="detail" x="26" y="730" font-size="17px" fill="#26342e">田地、种粮与身份安排使停留可以延</text><text data-field="detail" x="26" y="758" font-size="17px" fill="#26342e">续</text><text data-field="link-note" x="26" y="824" font-size="17px" fill="#647069">新冲突会改变原有安身条件</text><rect class="box" data-field="card" x="16" y="872" rx="8" width="288" height="133"/><text data-field="label" x="26" y="899" font-size="17px" fill="#285342">重新谈判</text><text data-field="detail" x="26" y="935" font-size="17px" fill="#26342e">接纳者的猜疑、征发或承诺落空会再</text><text data-field="detail" x="26" y="963" font-size="17px" fill="#26342e">次推动迁移</text><path class="line" d="M160 195V220"/><path d="m155 218 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 428V453"/><path d="m155 451 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 633V658"/><path d="m155 656 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 838V863"/><path d="m155 861 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>