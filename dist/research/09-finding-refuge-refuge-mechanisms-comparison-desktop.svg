<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 433" width="880" height="433"><title id="title">三种接纳机制：寄食、避乱组织与区域治理</title><desc id="desc">表格比较的是史料中可见的机制，不是对三案成效打分。李特案的“接纳”主要是允许就食并出现地方政治利用；郗鉴案是以首领组织千余家、在山地建立防护；张轨案则是以州级权力、治安和资源交换塑造较稳定的区域；刘弘的荆州措施是另列的跨案对照，不是李特入蜀时的政策。[[s1]] [[s6]] [[s8]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">粮食来源</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">保护与组织</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">接纳的边界</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="91"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">李特等入蜀</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="91"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">汉中难以独赈，蜀有仓储与</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">较好收成；但细密安置方案</text><text data-field="cell" x="190" y="141" font-size="16px" fill="#26342e">未见记载</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="91"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">李特兄弟途中救护并聚众；</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">赵廞借赈济收众，关系很快</text><text data-field="cell" x="413" y="141" font-size="16px" fill="#26342e">政治化</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="91"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">放行缺少细密安置；还乡、</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">停留与奖赏反复，地方猜疑</text><text data-field="cell" x="636" y="141" font-size="16px" fill="#26342e">加剧</text><rect class="box" data-field="cell" x="30" y="161" width="150" height="68"/><text data-field="cell" x="40" y="186" font-size="16px" fill="#26342e">郗鉴避乱</text><rect class="box" data-field="cell" x="180" y="161" width="223" height="68"/><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">峄山与邹山长期战争，史载</text><text data-field="cell" x="190" y="209" font-size="16px" fill="#26342e">百姓饥馑，粮食成为硬约束</text><rect class="box" data-field="cell" x="403" y="161" width="223" height="68"/><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">首领率高平千余家保山，取</text><text data-field="cell" x="413" y="209" font-size="16px" fill="#26342e">得刺史名义并维持屯驻</text><rect class="box" data-field="cell" x="626" y="161" width="223" height="68"/><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">组织能守不能保证供给，驻</text><text data-field="cell" x="636" y="209" font-size="16px" fill="#26342e">留三年仍被逼退屯合肥</text><rect class="box" data-field="cell" x="30" y="229" width="150" height="91"/><text data-field="cell" x="40" y="254" font-size="16px" fill="#26342e">张轨河西</text><rect class="box" data-field="cell" x="180" y="229" width="223" height="91"/><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">州级治理、军政能力与向中</text><text data-field="cell" x="190" y="277" font-size="16px" fill="#26342e">央供给并存；具体户口安置</text><text data-field="cell" x="190" y="300" font-size="16px" fill="#26342e">资料有限</text><rect class="box" data-field="cell" x="403" y="229" width="223" height="91"/><text data-field="cell" x="413" y="254" font-size="16px" fill="#26342e">平盗、御寇、任用谋主，把</text><text data-field="cell" x="413" y="277" font-size="16px" fill="#26342e">保护变成地方政权能力</text><rect class="box" data-field="cell" x="626" y="229" width="223" height="91"/><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">仍有长期战争；“务安百姓</text><text data-field="cell" x="636" y="277" font-size="16px" fill="#26342e">”是遗令，不能代替逐项效</text><text data-field="cell" x="636" y="300" font-size="16px" fill="#26342e">果证据</text><rect class="box" data-field="cell" x="30" y="320" width="150" height="91"/><text data-field="cell" x="40" y="345" font-size="16px" fill="#26342e">刘弘荆州对照</text><rect class="box" data-field="cell" x="180" y="320" width="223" height="91"/><text data-field="cell" x="190" y="345" font-size="16px" fill="#26342e">给流民田及种粮，把即时救</text><text data-field="cell" x="190" y="368" font-size="16px" fill="#26342e">济转为生产资料</text><rect class="box" data-field="cell" x="403" y="320" width="223" height="91"/><text data-field="cell" x="413" y="345" font-size="16px" fill="#26342e">擢其贤才，随资叙用，补足</text><text data-field="cell" x="413" y="368" font-size="16px" fill="#26342e">身份与任用关系</text><rect class="box" data-field="cell" x="626" y="320" width="223" height="91"/><text data-field="cell" x="636" y="345" font-size="16px" fill="#26342e">“流民遂安”是史书结果概</text><text data-field="cell" x="636" y="368" font-size="16px" fill="#26342e">括，不能反推为李特入蜀政</text><text data-field="cell" x="636" y="391" font-size="16px" fill="#26342e">策</text></svg>