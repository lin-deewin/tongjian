<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1466" width="320" height="1466"><title id="title">三种接纳机制：寄食、避乱组织与区域治理</title><desc id="desc">表格比较的是史料中可见的机制，不是对三案成效打分。李特案的“接纳”主要是允许就食并出现地方政治利用；郗鉴案是以首领组织千余家、在山地建立防护；张轨案则是以州级权力、治安和资源交换塑造较稳定的区域；刘弘的荆州措施是另列的跨案对照，不是李特入蜀时的政策。[[s1]] [[s6]] [[s8]] [[s12]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="344"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">李特等入蜀</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">粮食来源</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">汉中难以独赈，蜀有仓储与较好</text><text data-field="value" x="26" y="144" font-size="17px" fill="#26342e">收成；但细密安置方案未见记载</text><text data-field="dimension" x="26" y="180" font-size="17px" fill="#285342">保护与组织</text><text data-field="value" x="26" y="212" font-size="17px" fill="#26342e">李特兄弟途中救护并聚众；赵廞</text><text data-field="value" x="26" y="240" font-size="17px" fill="#26342e">借赈济收众，关系很快政治化</text><text data-field="dimension" x="26" y="276" font-size="17px" fill="#285342">接纳的边界</text><text data-field="value" x="26" y="308" font-size="17px" fill="#26342e">放行缺少细密安置；还乡、停留</text><text data-field="value" x="26" y="336" font-size="17px" fill="#26342e">与奖赏反复，地方猜疑加剧</text><rect class="box" data-field="case-card" x="16" y="380" rx="8" width="288" height="344"/><text data-field="case" x="26" y="406" font-size="17px" fill="#285342">郗鉴避乱</text><text data-field="dimension" x="26" y="442" font-size="17px" fill="#285342">粮食来源</text><text data-field="value" x="26" y="474" font-size="17px" fill="#26342e">峄山与邹山长期战争，史载百姓</text><text data-field="value" x="26" y="502" font-size="17px" fill="#26342e">饥馑，粮食成为硬约束</text><text data-field="dimension" x="26" y="538" font-size="17px" fill="#285342">保护与组织</text><text data-field="value" x="26" y="570" font-size="17px" fill="#26342e">首领率高平千余家保山，取得刺</text><text data-field="value" x="26" y="598" font-size="17px" fill="#26342e">史名义并维持屯驻</text><text data-field="dimension" x="26" y="634" font-size="17px" fill="#285342">接纳的边界</text><text data-field="value" x="26" y="666" font-size="17px" fill="#26342e">组织能守不能保证供给，驻留三</text><text data-field="value" x="26" y="694" font-size="17px" fill="#26342e">年仍被逼退屯合肥</text><rect class="box" data-field="case-card" x="16" y="738" rx="8" width="288" height="344"/><text data-field="case" x="26" y="764" font-size="17px" fill="#285342">张轨河西</text><text data-field="dimension" x="26" y="800" font-size="17px" fill="#285342">粮食来源</text><text data-field="value" x="26" y="832" font-size="17px" fill="#26342e">州级治理、军政能力与向中央供</text><text data-field="value" x="26" y="860" font-size="17px" fill="#26342e">给并存；具体户口安置资料有限</text><text data-field="dimension" x="26" y="896" font-size="17px" fill="#285342">保护与组织</text><text data-field="value" x="26" y="928" font-size="17px" fill="#26342e">平盗、御寇、任用谋主，把保护</text><text data-field="value" x="26" y="956" font-size="17px" fill="#26342e">变成地方政权能力</text><text data-field="dimension" x="26" y="992" font-size="17px" fill="#285342">接纳的边界</text><text data-field="value" x="26" y="1024" font-size="17px" fill="#26342e">仍有长期战争；“务安百姓”是</text><text data-field="value" x="26" y="1052" font-size="17px" fill="#26342e">遗令，不能代替逐项效果证据</text><rect class="box" data-field="case-card" x="16" y="1096" rx="8" width="288" height="344"/><text data-field="case" x="26" y="1122" font-size="17px" fill="#285342">刘弘荆州对照</text><text data-field="dimension" x="26" y="1158" font-size="17px" fill="#285342">粮食来源</text><text data-field="value" x="26" y="1190" font-size="17px" fill="#26342e">给流民田及种粮，把即时救济转</text><text data-field="value" x="26" y="1218" font-size="17px" fill="#26342e">为生产资料</text><text data-field="dimension" x="26" y="1254" font-size="17px" fill="#285342">保护与组织</text><text data-field="value" x="26" y="1286" font-size="17px" fill="#26342e">擢其贤才，随资叙用，补足身份</text><text data-field="value" x="26" y="1314" font-size="17px" fill="#26342e">与任用关系</text><text data-field="dimension" x="26" y="1350" font-size="17px" fill="#285342">接纳的边界</text><text data-field="value" x="26" y="1382" font-size="17px" fill="#26342e">“流民遂安”是史书结果概括，</text><text data-field="value" x="26" y="1410" font-size="17px" fill="#26342e">不能反推为李特入蜀政策</text></svg>