<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 364" width="880" height="364"><title id="title">疏广疏受的退出为什么能够落地</title><desc id="desc">定性比较依据《通鉴》关于请求骸骨、田庐、赏金与送行的记载；表中“可行条件”是作者从材料中归纳的分析，不是疏广列出的制度清单。[[s3]] [[s4]] [[s6]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="header" x="30" y="22" width="150" height="48"/><text data-field="header" x="40" y="47" font-size="17px" fill="#285342">案例</text><rect class="box" data-field="header" x="180" y="22" width="223" height="48"/><text data-field="header" x="190" y="47" font-size="17px" fill="#285342">退出前已有条件</text><rect class="box" data-field="header" x="403" y="22" width="223" height="48"/><text data-field="header" x="413" y="47" font-size="17px" fill="#285342">退后采取的安排</text><rect class="box" data-field="header" x="626" y="22" width="223" height="48"/><text data-field="header" x="636" y="47" font-size="17px" fill="#285342">证据与边界</text><rect class="box" data-field="cell" x="30" y="70" width="150" height="68"/><text data-field="cell" x="40" y="95" font-size="16px" fill="#26342e">许可</text><rect class="box" data-field="cell" x="180" y="70" width="223" height="68"/><text data-field="cell" x="190" y="95" font-size="16px" fill="#26342e">主动上疏请求骸骨，皇帝允</text><text data-field="cell" x="190" y="118" font-size="16px" fill="#26342e">许并赐金</text><rect class="box" data-field="cell" x="403" y="70" width="223" height="68"/><text data-field="cell" x="413" y="95" font-size="16px" fill="#26342e">离开太子师傅职位，回到乡</text><text data-field="cell" x="413" y="118" font-size="16px" fill="#26342e">里</text><rect class="box" data-field="cell" x="626" y="70" width="223" height="68"/><text data-field="cell" x="636" y="95" font-size="16px" fill="#26342e">不是被逐；仍依赖君主许可</text><text data-field="cell" x="636" y="118" font-size="16px" fill="#26342e">与制度位置</text><rect class="box" data-field="cell" x="30" y="138" width="150" height="68"/><text data-field="cell" x="40" y="163" font-size="16px" fill="#26342e">生活</text><rect class="box" data-field="cell" x="180" y="138" width="223" height="68"/><text data-field="cell" x="190" y="163" font-size="16px" fill="#26342e">家中已有旧田庐，基本衣食</text><text data-field="cell" x="190" y="186" font-size="16px" fill="#26342e">不必靠新置产业</text><rect class="box" data-field="cell" x="403" y="138" width="223" height="68"/><text data-field="cell" x="413" y="163" font-size="16px" fill="#26342e">保留旧业，使用赏金而不扩</text><text data-field="cell" x="413" y="186" font-size="16px" fill="#26342e">大地产</text><rect class="box" data-field="cell" x="626" y="138" width="223" height="68"/><text data-field="cell" x="636" y="163" font-size="16px" fill="#26342e">不等于反对财富；前提是已</text><text data-field="cell" x="636" y="186" font-size="16px" fill="#26342e">有生活底盘</text><rect class="box" data-field="cell" x="30" y="206" width="150" height="68"/><text data-field="cell" x="40" y="231" font-size="16px" fill="#26342e">家族</text><rect class="box" data-field="cell" x="180" y="206" width="223" height="68"/><text data-field="cell" x="190" y="231" font-size="16px" fill="#26342e">担心多余财富使子孙怠惰或</text><text data-field="cell" x="190" y="254" font-size="16px" fill="#26342e">招怨</text><rect class="box" data-field="cell" x="403" y="206" width="223" height="68"/><text data-field="cell" x="413" y="231" font-size="16px" fill="#26342e">让子孙勤力旧业，与常人相</text><text data-field="cell" x="413" y="254" font-size="16px" fill="#26342e">齐</text><rect class="box" data-field="cell" x="626" y="206" width="223" height="68"/><text data-field="cell" x="636" y="231" font-size="16px" fill="#26342e">是疏广的家庭判断，不能推</text><text data-field="cell" x="636" y="254" font-size="16px" fill="#26342e">成普遍规律</text><rect class="box" data-field="cell" x="30" y="274" width="150" height="68"/><text data-field="cell" x="40" y="299" font-size="16px" fill="#26342e">关系</text><rect class="box" data-field="cell" x="180" y="274" width="223" height="68"/><text data-field="cell" x="190" y="299" font-size="16px" fill="#26342e">皇帝、太子、公卿故人共同</text><text data-field="cell" x="190" y="322" font-size="16px" fill="#26342e">送行并赐金</text><rect class="box" data-field="cell" x="403" y="274" width="223" height="68"/><text data-field="cell" x="413" y="299" font-size="16px" fill="#26342e">与族人、故旧、宾客分享恩</text><text data-field="cell" x="413" y="322" font-size="16px" fill="#26342e">赐</text><rect class="box" data-field="cell" x="626" y="274" width="223" height="68"/><text data-field="cell" x="636" y="299" font-size="16px" fill="#26342e">关系仍在延续，退出不等于</text><text data-field="cell" x="636" y="322" font-size="16px" fill="#26342e">切断社会网络</text></svg>