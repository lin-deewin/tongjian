<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 1354" width="320" height="1354"><title id="title">疏广疏受的退出为什么能够落地</title><desc id="desc">定性比较依据《通鉴》关于请求骸骨、田庐、赏金与送行的记载；表中“可行条件”是作者从材料中归纳的分析，不是疏广列出的制度清单。[[s3]] [[s4]] [[s6]]</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="case-card" x="16" y="22" rx="8" width="288" height="316"/><text data-field="case" x="26" y="48" font-size="17px" fill="#285342">许可</text><text data-field="dimension" x="26" y="84" font-size="17px" fill="#285342">退出前已有条件</text><text data-field="value" x="26" y="116" font-size="17px" fill="#26342e">主动上疏请求骸骨，皇帝允许并</text><text data-field="value" x="26" y="144" font-size="17px" fill="#26342e">赐金</text><text data-field="dimension" x="26" y="180" font-size="17px" fill="#285342">退后采取的安排</text><text data-field="value" x="26" y="212" font-size="17px" fill="#26342e">离开太子师傅职位，回到乡里</text><text data-field="dimension" x="26" y="248" font-size="17px" fill="#285342">证据与边界</text><text data-field="value" x="26" y="280" font-size="17px" fill="#26342e">不是被逐；仍依赖君主许可与制</text><text data-field="value" x="26" y="308" font-size="17px" fill="#26342e">度位置</text><rect class="box" data-field="case-card" x="16" y="352" rx="8" width="288" height="344"/><text data-field="case" x="26" y="378" font-size="17px" fill="#285342">生活</text><text data-field="dimension" x="26" y="414" font-size="17px" fill="#285342">退出前已有条件</text><text data-field="value" x="26" y="446" font-size="17px" fill="#26342e">家中已有旧田庐，基本衣食不必</text><text data-field="value" x="26" y="474" font-size="17px" fill="#26342e">靠新置产业</text><text data-field="dimension" x="26" y="510" font-size="17px" fill="#285342">退后采取的安排</text><text data-field="value" x="26" y="542" font-size="17px" fill="#26342e">保留旧业，使用赏金而不扩大地</text><text data-field="value" x="26" y="570" font-size="17px" fill="#26342e">产</text><text data-field="dimension" x="26" y="606" font-size="17px" fill="#285342">证据与边界</text><text data-field="value" x="26" y="638" font-size="17px" fill="#26342e">不等于反对财富；前提是已有生</text><text data-field="value" x="26" y="666" font-size="17px" fill="#26342e">活底盘</text><rect class="box" data-field="case-card" x="16" y="710" rx="8" width="288" height="288"/><text data-field="case" x="26" y="736" font-size="17px" fill="#285342">家族</text><text data-field="dimension" x="26" y="772" font-size="17px" fill="#285342">退出前已有条件</text><text data-field="value" x="26" y="804" font-size="17px" fill="#26342e">担心多余财富使子孙怠惰或招怨</text><text data-field="dimension" x="26" y="840" font-size="17px" fill="#285342">退后采取的安排</text><text data-field="value" x="26" y="872" font-size="17px" fill="#26342e">让子孙勤力旧业，与常人相齐</text><text data-field="dimension" x="26" y="908" font-size="17px" fill="#285342">证据与边界</text><text data-field="value" x="26" y="940" font-size="17px" fill="#26342e">是疏广的家庭判断，不能推成普</text><text data-field="value" x="26" y="968" font-size="17px" fill="#26342e">遍规律</text><rect class="box" data-field="case-card" x="16" y="1012" rx="8" width="288" height="316"/><text data-field="case" x="26" y="1038" font-size="17px" fill="#285342">关系</text><text data-field="dimension" x="26" y="1074" font-size="17px" fill="#285342">退出前已有条件</text><text data-field="value" x="26" y="1106" font-size="17px" fill="#26342e">皇帝、太子、公卿故人共同送行</text><text data-field="value" x="26" y="1134" font-size="17px" fill="#26342e">并赐金</text><text data-field="dimension" x="26" y="1170" font-size="17px" fill="#285342">退后采取的安排</text><text data-field="value" x="26" y="1202" font-size="17px" fill="#26342e">与族人、故旧、宾客分享恩赐</text><text data-field="dimension" x="26" y="1238" font-size="17px" fill="#285342">证据与边界</text><text data-field="value" x="26" y="1270" font-size="17px" fill="#26342e">关系仍在延续，退出不等于切断</text><text data-field="value" x="26" y="1298" font-size="17px" fill="#26342e">社会网络</text></svg>