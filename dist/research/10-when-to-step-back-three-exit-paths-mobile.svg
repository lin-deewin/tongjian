<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 658" width="320" height="658"><title id="title">三种退出路径：缩小资源、获准离任、请求而未立即离任</title><desc id="desc">时间线按《通鉴》编年位置排列；李泌前后两次退意与入朝经历并非一条连续的隐退过程。事件先后可核对[[s1]] [[s3]] [[s8]] [[s11]] [[s12]]，图中只表示记载的行动顺序，不暗示古代存在统一的任期制度。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><path class="line" d="M51 37V634"/><circle data-field="event" cx="51" cy="37" r="8" fill="#285342"/><text data-field="event-label" x="69" y="42" font-size="17px" fill="#285342">汉高祖封功臣后 · 张良取</text><text data-field="event-label" x="69" y="70" font-size="17px" fill="#285342">留侯</text><text data-field="detail" x="69" y="106" font-size="17px" fill="#26342e">减少封地规模，保留爵位与政</text><text data-field="detail" x="69" y="134" font-size="17px" fill="#26342e">治身份</text><circle data-field="event" cx="51" cy="193" r="8" fill="#285342"/><text data-field="event-label" x="69" y="198" font-size="17px" fill="#285342">汉宣帝元康年间 · 疏广疏</text><text data-field="event-label" x="69" y="226" font-size="17px" fill="#285342">受请骸骨</text><text data-field="detail" x="69" y="262" font-size="17px" fill="#26342e">皇帝许可，职位有替代，回乡</text><text data-field="detail" x="69" y="290" font-size="17px" fill="#26342e">并安排赏金与家产</text><circle data-field="event" cx="51" cy="349" r="8" fill="#285342"/><text data-field="event-label" x="69" y="354" font-size="17px" fill="#285342">唐德宗贞元三年 · 李泌劝</text><text data-field="event-label" x="69" y="382" font-size="17px" fill="#285342">止废太子后求退</text><text data-field="detail" x="69" y="418" font-size="17px" fill="#26342e">提出骸骨请求，但皇帝未立即</text><text data-field="detail" x="69" y="446" font-size="17px" fill="#26342e">放行</text><circle data-field="event" cx="51" cy="505" r="8" fill="#285342"/><text data-field="event-label" x="69" y="510" font-size="17px" fill="#285342">其后至贞元五年 · 李泌促</text><text data-field="event-label" x="69" y="538" font-size="17px" fill="#285342">成置相</text><text data-field="detail" x="69" y="574" font-size="17px" fill="#26342e">衰病中推荐窦参、董晋，形成</text><text data-field="detail" x="69" y="602" font-size="17px" fill="#26342e">新的相职分工</text></svg>