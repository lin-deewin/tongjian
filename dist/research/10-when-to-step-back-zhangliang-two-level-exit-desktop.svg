<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 880 212" width="880" height="212"><title id="title">张良的两次“退”：资源收缩与责任保留</title><desc id="desc">这是对两段记载的分析示意；箭头表示行动的先后，不把张良的取少直接解释为后来复出的唯一原因。张良受封见[[s1]]，病中辅太子见[[s2]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="30" y="24" rx="8" width="191" height="164"/><text data-field="label" x="40" y="51" font-size="17px" fill="#285342">减少封地</text><text data-field="detail" x="40" y="82" font-size="16px" fill="#26342e">拒绝三万户，只取留县</text><text data-field="detail" x="40" y="105" font-size="16px" fill="#26342e">封侯</text><text data-field="link-note" x="40" y="162" font-size="13px" fill="#647069">封地减少改变资源规模，</text><text data-field="link-note" x="40" y="180" font-size="13px" fill="#647069">不等于取消政治身份</text><rect class="box" data-field="card" x="239" y="24" rx="8" width="191" height="164"/><text data-field="label" x="249" y="51" font-size="17px" fill="#285342">保留身份</text><text data-field="detail" x="249" y="82" font-size="16px" fill="#26342e">爵位与顾问位置仍在，</text><text data-field="detail" x="249" y="105" font-size="16px" fill="#26342e">未等于隐身</text><text data-field="link-note" x="249" y="162" font-size="13px" fill="#647069">身份仍在使后续责任可以</text><text data-field="link-note" x="249" y="180" font-size="13px" fill="#647069">被重新调用</text><rect class="box" data-field="card" x="448" y="24" rx="8" width="191" height="164"/><text data-field="label" x="458" y="51" font-size="17px" fill="#285342">危局复出</text><text data-field="detail" x="458" y="82" font-size="16px" fill="#26342e">病中为东征与太子防务</text><text data-field="detail" x="458" y="105" font-size="16px" fill="#26342e">提供判断</text><text data-field="link-note" x="458" y="162" font-size="13px" fill="#647069">临危承担顾问责任，显示</text><text data-field="link-note" x="458" y="180" font-size="13px" fill="#647069">退让与逃避不能混为一谈</text><rect class="box" data-field="card" x="657" y="24" rx="8" width="191" height="164"/><text data-field="label" x="667" y="51" font-size="17px" fill="#285342">边界显现</text><text data-field="detail" x="667" y="82" font-size="16px" fill="#26342e">离开某类资源，不等于</text><text data-field="detail" x="667" y="105" font-size="16px" fill="#26342e">退出政治</text><path class="line" d="M224 106H229"/><path d="m227 101 9 5-9 5z" fill="#285342"/><path class="line" d="M433 106H438"/><path d="m436 101 9 5-9 5z" fill="#285342"/><path class="line" d="M642 106H647"/><path d="m645 101 9 5-9 5z" fill="#285342"/></svg>