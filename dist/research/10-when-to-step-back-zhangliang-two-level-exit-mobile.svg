<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 320 782" width="320" height="782"><title id="title">张良的两次“退”：资源收缩与责任保留</title><desc id="desc">这是对两段记载的分析示意；箭头表示行动的先后，不把张良的取少直接解释为后来复出的唯一原因。张良受封见[[s1]]，病中辅太子见[[s2]]。</desc><rect width="100%" height="100%" fill="#fffef9"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif} .ink{fill:#285342} .line{stroke:#285342;stroke-width:2;fill:none} .box{fill:#f4f2ec;stroke:#bfc9c1;stroke-width:1.5}</style><rect class="box" data-field="card" x="16" y="24" rx="8" width="288" height="171"/><text data-field="label" x="26" y="51" font-size="17px" fill="#285342">减少封地</text><text data-field="detail" x="26" y="87" font-size="17px" fill="#26342e">拒绝三万户，只取留县封侯</text><text data-field="link-note" x="26" y="153" font-size="17px" fill="#647069">封地减少改变资源规模，不等于</text><text data-field="link-note" x="26" y="181" font-size="17px" fill="#647069">取消政治身份</text><rect class="box" data-field="card" x="16" y="229" rx="8" width="288" height="171"/><text data-field="label" x="26" y="256" font-size="17px" fill="#285342">保留身份</text><text data-field="detail" x="26" y="292" font-size="17px" fill="#26342e">爵位与顾问位置仍在，未等于隐身</text><text data-field="link-note" x="26" y="358" font-size="17px" fill="#647069">身份仍在使后续责任可以被重新</text><text data-field="link-note" x="26" y="386" font-size="17px" fill="#647069">调用</text><rect class="box" data-field="card" x="16" y="434" rx="8" width="288" height="171"/><text data-field="label" x="26" y="461" font-size="17px" fill="#285342">危局复出</text><text data-field="detail" x="26" y="497" font-size="17px" fill="#26342e">病中为东征与太子防务提供判断</text><text data-field="link-note" x="26" y="563" font-size="17px" fill="#647069">临危承担顾问责任，显示退让与</text><text data-field="link-note" x="26" y="591" font-size="17px" fill="#647069">逃避不能混为一谈</text><rect class="box" data-field="card" x="16" y="639" rx="8" width="288" height="105"/><text data-field="label" x="26" y="666" font-size="17px" fill="#285342">边界显现</text><text data-field="detail" x="26" y="702" font-size="17px" fill="#26342e">离开某类资源，不等于退出政治</text><path class="line" d="M160 195V220"/><path d="m155 218 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 400V425"/><path d="m155 423 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/><path class="line" d="M160 605V630"/><path d="m155 628 5 8 5-8" fill="none" stroke="#285342" stroke-width="2"/></svg>