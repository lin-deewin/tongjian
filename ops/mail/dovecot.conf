# Standalone Dovecot 2.4 configuration: deliberately no system/PAM logins.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols = imap lmtp
listen = 127.0.0.1
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /etc/mail/tls/fullchain.pem
ssl_server_key_file = /etc/mail/tls/privkey.pem
auth_allow_cleartext = no
auth_mechanisms = plain login
auth_username_format = %{user | lower}
auth_failure_delay = 3s
passdb passwd-file {
  passwd_file_path = /etc/dovecot/mail-users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/mail-users
}
mail_driver = maildir
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = VMAIL_UID
last_valid_uid = VMAIL_UID
mail_max_userip_connections = 10
mail_plugins {
  quota = yes
}
quota "Mailbox quota" {
  driver = count
  storage_size = 1G
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
    quota_storage_extra = 100M
  }
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}
protocol lmtp {
  postmaster_address = postmaster@deewins.top
  lmtp_rcpt_check_quota = yes
}
default_process_limit = 20
default_vsz_limit = 256M
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service imap {
  process_limit = 30
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
